<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rolecard-agent 控制台</title>
      <script>
      // 首帧前把外观偏好写到 <html>（否则会先闪一下默认材质）：材质/配色各一个键。
      // 读法与 lib/appearance.ts 一致 —— 那边是 React 侧的权威，这里只是提前一拍。
      try {
        var m = localStorage.getItem("rolecard.material");
        var p = localStorage.getItem("rolecard.palette");
        document.documentElement.setAttribute("data-material", m === "panel" ? "panel" : "glass");
        document.documentElement.setAttribute("data-palette", p === "cool" ? "cool" : "warm");
        // 透明度滑块 → 实心度：CSS 那三个变量是被 color-mix(色 X%, transparent) 消费的，
        // X 是"留多少色"，与滑块的"透多少"方向相反 —— 必须做一次 100 - a。
        // 算术与 lib/appearance.ts 的 soliditiesFor 逐字一致（这份跑在打包前的裸 HTML 里，
        // import 不到那边；改那边记得改这里，方向已由 appearance.test.ts 钉住）。
        var raw = localStorage.getItem("rolecard.alpha");
        var a = raw === null || raw === "" ? 0 : Number(raw);
        if (isFinite(a) && a >= 0 && a <= 100) {
          // 变量名避开下面背景图那格既有的 bg（var 是脚本作用域，同名会互相盖掉）
          var solid = 100 - a;
          document.documentElement.style.setProperty("--bg-alpha", solid + "%");
          document.documentElement.style.setProperty("--glass-alpha", Math.max(0, solid - 12) + "%");
          document.documentElement.style.setProperty("--glass-alpha-soft", Math.max(0, solid - 4) + "%");
        }
        // 背景图 + 模糊/暗化
        var bg = localStorage.getItem("rolecard.bgImage");
        if (bg) {
          document.documentElement.style.setProperty("--bg-image", 'url("' + bg + '")');
        }
        var blur = Number(localStorage.getItem("rolecard.bgBlur"));
        if (isFinite(blur)) {
          document.documentElement.style.setProperty("--bg-blur", blur + "px");
        }
        // 暗化：键不存在必须落 0.25（与 lib/appearance.ts 的 readNumber 兜底同值）。
        // 旧写法 Number(getItem(k)) 在缺键时给出 0（Number(null)===0 且有限），于是
        // "没设过"被读成"设了 0"= 没有暗化层，首帧字压在亮图上 —— 两边不一致还
        // 会让这份脚本失去它存在的意义（避免首帧闪错）。
        var rawDim = localStorage.getItem("rolecard.bgDim");
        var dim = rawDim === null || rawDim === "" ? 0.25 : Number(rawDim);
        if (isFinite(dim)) {
          document.documentElement.style.setProperty("--bg-dim", String(dim));
        }
      } catch (e) { /* 隐私模式等：留给 CSS 默认值 */ }
    </script>
    <script type="module" crossorigin src="/assets/index-HZayaWta.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/react-CC_ZIGTP.js">
    <link rel="stylesheet" crossorigin href="/assets/index-CGXEu2LU.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
