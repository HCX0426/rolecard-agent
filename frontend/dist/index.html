<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rolecard-agent 控制台</title>
      <script>
      // 首帧前把外观偏好写到 <html>（否则会先闪一下默认材质）：材质/配色各一个键。
      // 读法与 lib/appearance.ts 一致 —— 那边是 React 侧的权威，这里只是提前一拍。
      try {
        var m = localStorage.getItem("rolecard.material");
        var p = localStorage.getItem("rolecard.palette");
        document.documentElement.setAttribute("data-material", m === "panel" ? "panel" : "glass");
        document.documentElement.setAttribute("data-palette", p === "cool" ? "cool" : "warm");
        // 透明度（整个界面的透光量）：底色 --bg-alpha + 玻璃层（比底色更实一点）
        var a = Number(localStorage.getItem("rolecard.alpha"));
        if (isFinite(a) && a >= 0 && a <= 100) {
          document.documentElement.style.setProperty("--bg-alpha", a + "%");
          document.documentElement.style.setProperty("--glass-alpha", Math.max(0, a - 12) + "%");
          document.documentElement.style.setProperty("--glass-alpha-soft", Math.max(0, a - 4) + "%");
        }
        // 背景图 + 模糊/暗化
        var bg = localStorage.getItem("rolecard.bgImage");
        if (bg) {
          document.documentElement.style.setProperty("--bg-image", 'url("' + bg + '")');
        }
        var blur = Number(localStorage.getItem("rolecard.bgBlur"));
        if (isFinite(blur)) {
          document.documentElement.style.setProperty("--bg-blur", blur + "px");
        }
        var dim = Number(localStorage.getItem("rolecard.bgDim"));
        if (isFinite(dim)) {
          document.documentElement.style.setProperty("--bg-dim", String(dim));
        }
      } catch (e) { /* 隐私模式等：留给 CSS 默认值 */ }
    </script>
    <script type="module" crossorigin src="/assets/index-CBy3yoZ2.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/react-CC_ZIGTP.js">
    <link rel="stylesheet" crossorigin href="/assets/index-B0bN5HZB.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
