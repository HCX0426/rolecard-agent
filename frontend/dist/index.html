    <title>rolecard-agent 控制台</title>
      <script>
      // 首帧前把外观偏好写到 <html>（否则会先闪一下默认材质）。
      // ⚠ 这份与 lib/appearance.ts 是**同一件事的两处落地**，不是两套规则：它跑在打包前的
      // 裸 HTML 里，import 不到那边，所以只能照抄。抄的规矩（2026-11-03 归一化后收紧）：
      // **每档只做一条赋值**，兜底数字与 index.css 的字面值由 scripts/consistency 的
      // 「外观默认值单一真值」断言对死。从前这里也写三档 alpha，内联样式压过 .dark，
      // 于是 CSS 里深色那组（92%/97%）一次都没生效过 —— 现在只写 --bg-solid 一个数，
      // 层次差留在 CSS（它管主题管深浅），两边都不可能再互相盖。
      try {
        var de = document.documentElement;
        var m = localStorage.getItem("rolecard.material");
        var p = localStorage.getItem("rolecard.palette");
        de.setAttribute("data-material", m === "panel" ? "panel" : "glass");
        de.setAttribute("data-palette", p === "cool" ? "cool" : "warm");
        // 明暗：**键不存在时才读系统偏好** —— 这是 React 侧 useTheme 的 initial()，从前
        // 这份首帧脚本压根不管明暗，于是深色用户每次启动都先闪一帧浅色再翻。实测这帧
        // 闪在首绘之前（.dark 挂在 t=35ms，first-paint 在 t=704ms），用户看不到，但
        // 壳的着陆页与它之间确实有两种配色。现在两处同判据、同一时刻落地。
        var t = localStorage.getItem("theme");
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        de.classList.toggle("dark", dark);
        // 透明度滑块 → 实心度：CSS 那一路是被 color-mix(色 X%, transparent) 消费的，
        // X 是"留多少色"，与滑块的"透多少"方向相反 —— 必须做一次 100 - a。
        var raw = localStorage.getItem("rolecard.alpha");
        var a = raw === null || raw === "" ? 0 : Number(raw);
        // 圆整 + 夹取必须与 `lib/appearance.ts` 的 `bgSolidity` **逐值等价**（对拍钉在
        // `lib/firstFrameParity.test.ts`：真执行这段脚本本体，与 React 路径逐个输入比）。
        // 这份脚本跑在打包前的裸 HTML 里，import 不到那边，只能抄 —— 抄就得可验证，
        // 否则两份算术漂出去没人知道（一致性尺子只钉文本形状，钉不住算术）。
        // ⚠ 顺序写死成"先 clamp 再 100 -"，与 `bgSolidity` 同一形状。少了 round 时
        //   `33.7` 首帧算 66.3、React 算 66（差 1，对拍会红）—— 不是"差 0.x"，
        //   这句以前写错过；数值是从真跑两遍算术量出来的。
        // 实测记录（2026-11-04）：装机版盘上是 `rolecard.alpha = 0`（整数），而且
        // `f2b26041` / `07135b39` 那两版 setter 都过 `clampAlpha`（含 Math.round），
        // 所以"历史小数值"这条**今天不可达**。加 round 不是修一个已发生的故障，而是
        // 让两份算术对**任何**输入等价 —— 那个等价此前没有任何东西保证。
        if (isFinite(a)) {
          var clamped = Math.max(0, Math.min(100, Math.round(a)));
          de.style.setProperty("--bg-solid", String(100 - clamped));
        }


        // 背景图三件套：与 lib/appearance.ts 的 applyBgImage/applyBgBlur/applyBgDim 同构 ——
        // 没设过就**不写**，让 index.css 那一份默认做主（从前这里给 dim 兜了个值写进内联，
        // 把 CSS 的默认盖死）。
        var bg = localStorage.getItem("rolecard.bgImage");
        if (bg) {
          de.setAttribute("data-has-bg", "");
          de.style.setProperty("--bg-image", 'url("' + bg + '")');
        }
        var blur = localStorage.getItem("rolecard.bgBlur");
        if (blur !== null && blur !== "" && isFinite(Number(blur))) {
          de.style.setProperty("--bg-blur", Number(blur) + "px");
        }
        var dim = localStorage.getItem("rolecard.bgDim");
        if (dim !== null && dim !== "" && isFinite(Number(dim))) {
          de.style.setProperty("--bg-dim", String(Number(dim)));
        }
      } catch (e) { /* 隐私模式等：留给 CSS 默认值 */ }
    </script>
