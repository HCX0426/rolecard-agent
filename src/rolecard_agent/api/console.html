<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rolecard-agent 管理控制台</title>
  <style>
    :root { color-scheme: light; --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --ink:#1f2329; --muted:#6b7280; --accent:#2563eb; --danger:#dc2626; --ok:#16a34a; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 system-ui,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
    header { padding:16px 24px; background:var(--card); border-bottom:1px solid var(--line); }
    header h1 { margin:0; font-size:18px; }
    header p { margin:4px 0 0; color:var(--muted); font-size:12px; }
    main { max-width:960px; margin:0 auto; padding:24px; display:grid; gap:24px; }
    section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; }
    section h2 { margin:0 0 12px; font-size:15px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; font-size:12px; }
    code { background:#eef1f5; padding:1px 5px; border-radius:4px; font-size:12px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:7px; padding:6px 12px; cursor:pointer; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    button.danger { color:var(--danger); border-color:var(--danger); background:#fff; }
    button.ghost { background:transparent; }
    label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
    input, textarea { width:100%; font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); }
    textarea { min-height:72px; resize:vertical; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .muted { color:var(--muted); }
    .pill { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); }
    .pill.on { color:var(--ok); border-color:var(--ok); }
    .pill.off { color:var(--muted); }
    .switch { position:relative; display:inline-block; width:42px; height:22px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; inset:0; background:#cbd2da; border-radius:999px; transition:.15s; }
    .slider:before { content:""; position:absolute; height:16px; width:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
    .switch input:checked + .slider { background:var(--ok); }
    .switch input:checked + .slider:before { transform:translateX(20px); }
    #status { font-size:12px; min-height:18px; }
    #status.ok { color:var(--ok); }
    #status.err { color:var(--danger); }
    .hidden { display:none; }
    /* --- chat --- */
    #msgs { display:flex; flex-direction:column; gap:10px; max-height:420px; overflow-y:auto; padding:4px 2px; }
    .bubble { max-width:82%; padding:9px 12px; border-radius:10px; white-space:pre-wrap; word-break:break-word; font-size:13px; }
    .bubble.user { align-self:flex-end; background:var(--accent); color:#fff; }
    .bubble.bot { align-self:flex-start; background:#eef1f5; }
    .bubble.bot .toolchip { display:block; font-size:11px; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:6px; padding:3px 7px; margin:6px 0 0; }
    .bubble.bot .toolchip b { color:var(--ink); font-weight:600; }
    #chatBar { display:flex; gap:8px; margin-top:12px; }
    #chatBar input { flex:1; }
    #roleSelect { font:inherit; padding:6px 9px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); }
    .caret { display:inline-block; width:7px; background:var(--muted); animation:blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
  </style>
</head>
<body>
  <header>
    <h1>rolecard-agent 管理控制台</h1>
    <p>角色卡 CRUD 与插件启停（操作员动作，非 LLM 工具）。停用插件后下一轮对话立即生效，无需重启。</p>
  </header>
  <main>
    <section id="chat">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">对话（SSE 流式）</h2>
        <div class="row">
          <select id="roleSelect"></select>
          <button class="primary" id="newSessionBtn">新会话</button>
        </div>
      </div>
      <p class="muted" id="chatMeta" style="margin:8px 0 0">先点「新会话」创建会话；切换角色后下一轮立即生效，历史消息保留。</p>
      <div id="msgs"></div>
      <div id="chatBar">
        <input id="chatInput" placeholder="输入消息，回车发送" />
        <button class="primary" id="sendBtn">发送</button>
      </div>
    </section>

    <section id="roles">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">角色卡</h2>
        <button class="primary" id="newBtn">+ 新建角色</button>
      </div>

      <form id="roleForm" class="hidden" style="margin-top:14px;border:1px dashed var(--line);border-radius:8px;padding:14px">
        <input type="hidden" id="roleIdEdit" />
        <div class="grid2">
          <div>
            <label>role_id（小写字母/数字/下划线，新建后不可改）</label>
            <input id="roleId" pattern="[a-z][a-z0-9_]*" />
          </div>
          <div>
            <label>role_name</label>
            <input id="roleName" />
          </div>
        </div>
        <label>system_prompt（人设规则）</label>
        <textarea id="systemPrompt"></textarea>
        <div class="grid2">
          <div>
            <label>temperature（0–1）</label>
            <input id="temperature" type="number" step="0.1" min="0" max="1" value="0.7" />
          </div>
          <div>
            <label>model_name（后端名，留空用默认）</label>
            <input id="modelName" placeholder="local" />
          </div>
        </div>
        <label>tool_whitelist（逗号分隔；留空 = 启用插件的所有工具；填 <code>[]</code> 表示无工具）</label>
        <input id="toolWhitelist" placeholder="query_health_record, compare_health_index" />
        <label>knowledge_scopes（逗号分隔；留空 = 不检索）</label>
        <input id="knowledgeScopes" placeholder="reports_2026" />
        <label>description</label>
        <input id="description" />
        <div class="row" style="margin-top:12px">
          <button class="primary" id="saveBtn" type="button">保存</button>
          <button class="ghost" id="cancelBtn" type="button">取消</button>
        </div>
      </form>

      <table style="margin-top:14px">
        <thead>
          <tr><th>role_id</th><th>name</th><th>model</th><th>工具白名单</th><th>类型</th><th></th></tr>
        </thead>
        <tbody id="roleRows"></tbody>
      </table>
    </section>

    <section id="plugins">
      <h2>插件（领域模块）</h2>
      <p class="muted" style="margin:0 0 10px">切换即写入审计并递增全局 <code>tool_epoch</code>；被禁用的插件其工具对模型立即不可见。</p>
      <table>
        <thead><tr><th>plugin_id</th><th>display_name</th><th>状态</th><th></th></tr></thead>
        <tbody id="pluginRows"></tbody>
      </table>
    </section>

    <div id="status"></div>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  function setStatus(msg, kind) {
    const s = $("status");
    s.textContent = msg;
    s.className = kind || "";
  }
  async function api(method, url, body) {
    const opt = { method, headers: {} };
    if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
    const res = await fetch(url, opt);
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) throw new Error((data && data.detail) || (res.status + " " + res.statusText));
    return data;
  }
  function splitList(v) {
    if (!v || !v.trim()) return null;
    return v.split(",").map((s) => s.trim()).filter(Boolean);
  }

  async function loadRoles() {
    const rows = await api("GET", "/api/roles");
    $("roleRows").innerHTML = rows.map((r) => {
      const wl = r.tool_whitelist ? r.tool_whitelist.join(", ") : (r.tool_whitelist === null ? "（全部）" : "（无）");
      const builtin = r.is_builtin ? '<span class="pill on">内置</span>' : '<span class="pill off">自定义</span>';
      const del = r.is_builtin ? "" : `<button class="danger ghost" onclick="delRole('${r.role_id}')">删除</button>`;
      return `<tr>
        <td><code>${r.role_id}</code></td>
        <td>${escapeHtml(r.role_name)}</td>
        <td>${escapeHtml(r.model_name || "默认")}</td>
        <td>${escapeHtml(wl)}</td>
        <td>${builtin}</td>
        <td class="row"><button class="ghost" onclick="editRole('${r.role_id}')">编辑</button>${del}</td>
      </tr>`;
    }).join("");
  }
  async function loadPlugins() {
    const rows = await api("GET", "/api/plugins");
    $("pluginRows").innerHTML = rows.map((p) => {
      const cls = p.enabled ? "on" : "off";
      const label = p.enabled ? "已启用" : "已停用";
      return `<tr>
        <td><code>${p.plugin_id}</code></td>
        <td>${escapeHtml(p.display_name || p.plugin_id)}</td>
        <td><span class="pill ${cls}">${label}</span></td>
        <td><label class="switch"><input type="checkbox" ${p.enabled ? "checked" : ""} onchange="togglePlugin('${p.plugin_id}', this.checked)"><span class="slider"></span></label></td>
      </tr>`;
    }).join("");
  }

  function openForm(edit) {
    $("roleForm").classList.remove("hidden");
    $("roleId").disabled = !!edit;
    $("newBtn").classList.add("hidden");
  }
  function closeForm() {
    $("roleForm").classList.add("hidden");
    $("newBtn").classList.remove("hidden");
    $("roleForm").reset();
    $("roleIdEdit").value = "";
    $("roleId").disabled = false;
  }
  $("newBtn").onclick = () => openForm(false);
  $("cancelBtn").onclick = closeForm;

  async function editRole(roleId) {
    const r = (await api("GET", "/api/roles")).find((x) => x.role_id === roleId);
    if (!r) return;
    openForm(true);
    $("roleIdEdit").value = r.role_id;
    $("roleId").value = r.role_id;
    $("roleName").value = r.role_name || "";
    $("systemPrompt").value = r.system_prompt || "";
    $("temperature").value = r.temperature ?? 0.7;
    $("modelName").value = r.model_name || "";
    $("toolWhitelist").value = (r.tool_whitelist || []).join(", ");
    $("knowledgeScopes").value = (r.knowledge_scopes || []).join(", ");
    $("description").value = r.description || "";
  }
  async function delRole(roleId) {
    if (!confirm("确认删除角色 " + roleId + "？此操作不可撤销。")) return;
    try {
      await api("DELETE", "/api/roles/" + roleId);
      setStatus("已删除角色 " + roleId, "ok");
      loadRoles();
    } catch (e) { setStatus("删除失败：" + e.message, "err"); }
  }
  $("saveBtn").onclick = async () => {
    const id = $("roleId").value.trim();
    const isEdit = !!$("roleIdEdit").value;
    if (!isEdit && !/^[a-z][a-z0-9_]*$/.test(id)) { setStatus("role_id 必须是小写字母/数字/下划线", "err"); return; }
    const payload = {
      role_id: id,
      role_name: $("roleName").value.trim(),
      system_prompt: $("systemPrompt").value,
      temperature: Number($("temperature").value),
      model_name: $("modelName").value.trim() || null,
      tool_whitelist: splitList($("toolWhitelist").value),
      knowledge_scopes: splitList($("knowledgeScopes").value),
      description: $("description").value.trim() || null,
    };
    try {
      if (isEdit) { await api("PATCH", "/api/roles/" + id, payload); setStatus("已更新角色 " + id, "ok"); }
      else { await api("POST", "/api/roles", payload); setStatus("已创建角色 " + id, "ok"); }
      closeForm();
      loadRoles();
    } catch (e) { setStatus("保存失败：" + e.message, "err"); }
  };

  async function togglePlugin(pluginId, enabled) {
    try {
      const r = await api("POST", "/api/plugins/" + pluginId + "/toggle", { enabled });
      setStatus("插件 " + pluginId + " → " + (enabled ? "启用" : "停用") + "（tool_epoch=" + r.tool_epoch + "）", "ok");
      loadPlugins();
    } catch (e) {
      setStatus("切换失败：" + e.message, "err");
      loadPlugins();
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  // ---------------------------------------------------------------- chat（SSE 流式）
  let sessionId = null;
  let sending = false;

  async function loadRoleOptions() {
    const roles = await api("GET", "/api/roles");
    $("roleSelect").innerHTML = roles
      .map((r) => `<option value="${r.role_id}">${escapeHtml(r.role_name)}</option>`)
      .join("");
  }

  $("newSessionBtn").onclick = async () => {
    try {
      const s = await api("POST", "/api/session", { role_id: $("roleSelect").value || null });
      sessionId = s.thread_id;
      $("msgs").innerHTML = "";
      $("chatMeta").textContent = "会话 " + s.thread_id + " · 当前角色：" + s.role_name;
      setStatus("会话已创建", "ok");
    } catch (e) { setStatus("创建会话失败：" + e.message, "err"); }
  };

  $("roleSelect").onchange = async () => {
    if (!sessionId) return; // 尚无会话：仅记住选择，创建时生效
    try {
      const r = await api("PATCH", "/api/session/" + sessionId, { role_id: $("roleSelect").value });
      $("chatMeta").textContent = "会话 " + sessionId + " · 当前角色：" + r.role_name + "（下一轮生效，历史保留）";
      setStatus("已切换角色 → " + r.role_name, "ok");
    } catch (e) { setStatus("切换角色失败：" + e.message, "err"); }
  };

  function scrollMsgs() { $("msgs").scrollTop = $("msgs").scrollHeight; }
  function appendUser(text) {
    const div = document.createElement("div");
    div.className = "bubble user";
    div.textContent = text;
    $("msgs").appendChild(div); scrollMsgs();
    return div;
  }
  function appendBot() {
    const div = document.createElement("div");
    div.className = "bubble bot";
    div.dataset.text = "";
    div.innerHTML = '<span class="caret">&nbsp;</span>';
    $("msgs").appendChild(div); scrollMsgs();
    return div;
  }
  function botRender(bot) {
    bot.innerHTML = escapeHtml(bot.dataset.text) + '<span class="caret">&nbsp;</span>';
    scrollMsgs();
  }
  function addChip(bot, label, detail) {
    const chip = document.createElement("span");
    chip.className = "toolchip";
    chip.textContent = label + (detail ? "：" + detail : "");
    if (detail) chip.title = detail;
    bot.appendChild(chip); scrollMsgs();
  }

  function handleChatEvent(ev, bot) {
    if (ev.type === "start") { /* 角色信息已在会话栏展示 */ }
    else if (ev.type === "token") { bot.dataset.text += ev.text; botRender(bot); }
    else if (ev.type === "message_replace") { bot.dataset.text = ev.text; botRender(bot); }
    else if (ev.type === "tool_call") { addChip(bot, "🔧 调用 " + ev.name); }
    else if (ev.type === "tool_result") { addChip(bot, "✅ " + ev.name, String(ev.content).slice(0, 120)); }
    else if (ev.type === "error") { bot.dataset.text += "\n[错误] " + ev.detail; botRender(bot); }
    else if (ev.type === "end") { bot.innerHTML = escapeHtml(bot.dataset.text); }
  }

  async function sendChat() {
    const text = $("chatInput").value.trim();
    if (!text) return;
    if (!sessionId) { setStatus("请先点击「新会话」", "err"); return; }
    if (sending) return;
    sending = true; $("chatInput").value = "";
    appendUser(text);
    const bot = appendBot();
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ thread_id: sessionId, message: text }),
      });
      if (!res.ok) {
        let detail = "HTTP " + res.status;
        try { detail = (await res.json()).detail || detail; } catch (_) {}
        bot.innerHTML = escapeHtml("[失败] " + detail);
        return;
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
          const line = frame.split("\n").find((l) => l.startsWith("data: "));
          if (!line) continue;
          handleChatEvent(JSON.parse(line.slice(6)), bot);
        }
      }
    } catch (e) {
      bot.dataset.text += "\n[网络错误] " + e.message; botRender(bot);
    } finally {
      sending = false;
      const caret = bot.querySelector(".caret"); if (caret) caret.remove();
    }
  }
  $("sendBtn").onclick = sendChat;
  $("chatInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });

  loadRoles().catch((e) => setStatus("加载角色失败：" + e.message, "err"));
  loadPlugins().catch((e) => setStatus("加载插件失败：" + e.message, "err"));
  loadRoleOptions().catch(() => {});
</script>
</body>
</html>
