# 桌面安装包（electron-builder）—— 里程碑 D②-4
#
# 分发形态 A：**后端打进包**（`extraResources` 那份 PyInstaller onedir），装到用户自己的
# 机器上、只绑 127.0.0.1。这台开发机不是公网服务器，用户的机器也不该是 —— 所以没有
# "共享服务"那条路（那属于形态 B，压在 v2.4 硬化后面）。
#
# 国内网络：下载 electron 与 builder 的二进制要走镜像，两条环境变量见 docs/开发流程.md
#   ELECTRON_MIRROR / ELECTRON_BUILDER_BINARIES_MIRROR

appId: com.rolecardagent.desktop
productName: rolecard-agent
copyright: ""

# 自动更新的 feed（设计稿《更新机制与OCR随包》§3.3）：electron-updater 读的就是这一段 ——
# provider: github 时它去 <owner>/<repo> 的 Releases 找 latest.yml。
# 这一行同时让 `npm run package` 在 shell/release/ 里**产出** latest.yml（元数据清单），
# 所以 release.yml 的 publish job 必须把它跟 exe 一起传进 Release：缺 latest.yml 的症状
# 是"检查更新永远报找不到更新"而不报错 —— 与 B1 那族"静默失效的防线"同一个形状。
# owner/repo 与 UPDATE_REPO（config.py）指的是同一个仓库；两处形状不同（yml 要拆开写），
# 一致性由门禁的 version/single-source 家族看着 —— 见 scripts/consistency 里的 update feed 断言。
publish:
  provider: github
  owner: HCX0426
  repo: rolecard-agent

directories:
  output: release
  # 默认就是 build/：shell/build/icon.ico 会被自动当应用图标（托盘/任务栏/安装包同源）

# 壳里**只有壳**：界面是后端托管的那一份 dist，不在这里复制第二套。
files:
  - out/**/*
  - web/**/*
  - package.json
  # 托盘图标。electron-builder 会把 build/icon.ico 用作**安装包/exe** 的图标，但那不等于
  # 它进了 asar —— 运行时 `nativeImage.createFromPath` 读的是包内路径。漏了这一条的表现
  # 很难查：托盘变成一个看不见也点不到的入口，而收起主窗之后它是唯一的出路。
  - build/icon.ico

extraResources:
  # PyInstaller 的产物（scripts/build_sidecar.py）。装完后运行期路径是
  # `resources/rolecard-backend/rolecard-backend.exe`，由 main/index.ts 按 app.isPackaged 拼出来。
  - from: ../build/sidecar/rolecard-backend
    to: rolecard-backend
  # 随包本地 OCR worker（scripts/tools/build_ocr_worker.py 的产物，258 MB 未压缩）。
  # **订正（2026-10-13 P0）**：这里从前写的是「少了这一条 electron-builder 会当场报找不到源，
  # 而不是安静地打出一个没有本地 OCR 的包」—— 那句话被 v0.3.0~v0.4.1 的每个包证伪：
  # 两条打包臂从没跑过 build_ocr_worker.py，源目录不存在，electron-builder 却**静默跳过**
  # 并照常出货（198 MB、无 OCR），而产物核对只有 60MB 体积判据、轻松放行。
  # 防线因此搬到 CI 上，三道闸：②b 构建失败即红 → 打包前点名源目录 → 打包后点名
  # win-unpacked/resources/ocr-worker/ocr-worker.exe（见 ci.yml / release.yml 的注释）。
  - from: ../build/ocrworker/ocr-worker
    to: ocr-worker

win:
  target:
    # dir = 未安装的解包目录：用来验"打包态"而不真的往系统里装东西
    - dir
    - nsis
  artifactName: rolecard-agent-${version}-${arch}.${ext}

nsis:
  oneClick: false
  # 装到用户目录：不需要 UAC，也不会有"Program Files 不可写"那一类坑（数据本来就在
  # %LOCALAPPDATA%，见 base/paths.py）
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: rolecard-agent
