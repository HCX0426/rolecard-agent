[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rolecard-agent"
version = "0.3.0"  # 版本单源：另三处（api/main.py 的 API_VERSION、两份 package.json）由 scripts/tools/bump_version.py 派生，四处一致性归门禁的 version parity
description = "Role-card driven conversational agent kernel with pluggable domain modules"
readme = "README.md"
# Declared floor = what we actually test. Development and CI run 3.13 (C:\.venv & CI images).
requires-python = ">=3.13"
license = { text = "MIT" }

# v1 core only. FastAPI / chromadb / rapidocr live in requirements-*.txt
# so that a v1 install never pulls the OCR stack (see C2).
dependencies = [
  "langchain==1.4.0",
  "langgraph==1.2.11",
  "langchain-core>=1.6.0",
  "langchain-ollama>=1.1.0",
  # 与 requirements.txt 同一条钉版口径（那边记着钉版原因）：检查点表是"会话的全部真相"，
  # 上游 layout 变更在本机不会有任何信号。两处约束必须逐字一致 —— parity 尺子比的就是这个
  # （2026-10-04 审查快照：此前这里裸奔，而 requirements 钉 ==3.1.1，漂移已实际发生）。
  "langgraph-checkpoint-sqlite==3.1.1",
  "pydantic>=2.13",
  # v2.4 联网与工作区工具（core/tools/web.py / files.py）：
  # 全部用活跃维护的独立轮子，不走已 sunset 的 langchain-community。
  "ddgs>=9.0",
  "trafilatura>=2.0",
  "tavily-python>=0.8",
  # 此前靠传递依赖兜住、被「依赖分层」检查抓成红的直接依赖（R28-11）：
  "httpx>=0.27",
  "typing_extensions>=4.12",
]

[project.optional-dependencies]
api = ["fastapi>=0.141", "uvicorn[standard]>=0.52", "python-multipart>=0.0.20"]
rag = ["chromadb>=1.5.9", "pypdf>=4.0"]
# Any OpenAI-compatible endpoint (DeepSeek / 通义 / Moonshot / 智谱 / OpenAI) goes through
# this one provider package. Kept optional so a local-only install stays offline-capable.
cloud = ["langchain-openai>=1.6.2"]
# OCR is deliberately NOT an extra: the OCR engine must run in a separate venv/process.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=7", "pytest-timeout>=2.3", "pytest-xdist>=3.6", "ruff>=0.6", "mypy>=1.11", "import-linter>=2.15", "httpx>=0.27", "pip-audit>=2.10", "pyinstaller>=6.22", "pip-tools>=7.4", "packaging>=24.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/rolecard_agent"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
# docs/ holds documentation, including archived design docs with illustrative code blocks.
# ruff can format fenced code inside Markdown, but reformatting historical docs is pure
# churn - and in the archive it is actively wrong, since those snippets are intentionally
# left as they were written.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# B008 会误报 FastAPI 的 `x: T = Depends(...)` —— 那正是框架要求的写法（依赖注入靠
# 默认值签名表达），不是"在默认参数里做函数调用"的坏味道。按官方建议登记为不可变调用。
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q -m 'not live'"
# 警告政策（2026-10-04 审查快照「-W ignore 全局吞警告」那条的落地）：门禁那层从前挂着一句
# `-W ignore`，把 langchain/langgraph 升级唯一的预警信号整条吃掉 —— 升级后 DeprecationWarning
# 刷满屏也没人红。现在政策住在这里（全仓唯一出处），**顺序承重**：后定义的条目优先级更高，
# 所以"把整类点亮"的 default 在前、"点名处置"的 error/ignore 在后 ——
#   1) 四类警告先按 default 点亮（Python 全局默认对 Deprecation/Resource 是 ignore：不点亮
#      就等于没有摘要，"白名单之外照旧可见"就是空话）。
#   2) 自有代码的弃用/前瞻警告**直接红**（module 匹配的是警告被归因的那个模块：stacklevel
#      指到我们调用点的，就是我们该改的）；三方自己的内部弃用停在摘要里 —— 看得见、不拦路。
#      将来真吵到没法看，往这里加带"谁的/为什么/何时删"三件事的白名单，不许无条件 ignore。
#   3) ResourceWarning 按**消息**精确放行两类已知形态，而不是整类吞掉：
#      - `unclosed database`：`ThreadLocalConnection` 把分线程的槽交给各线程自己收
#        （R102-02 的设计），另有若干用例故意造"父进程被硬杀"的现场。实测 740 条全在这一句上。
#      - `unclosed file ... trace.log/jsonl`：文件型 tracer 在实例活着期间持有句柄（设计如此）。
#      新出现的别的 ResourceWarning（比如某个我们自己该关没关的句柄）照旧进摘要。
filterwarnings = [
    "default::DeprecationWarning",
    "default::PendingDeprecationWarning",
    "default::FutureWarning",
    "default::ResourceWarning",
    "error::DeprecationWarning:rolecard_agent.*",
    "error::PendingDeprecationWarning:rolecard_agent.*",
    "error::FutureWarning:rolecard_agent.*",
    "ignore:unclosed database.*:ResourceWarning",
    "ignore:unclosed file .*trace\\.(log|jsonl).*:ResourceWarning",
]
# 单条用例挂死的保险丝（2026-10-04 审查快照）：从前唯一防线是 job 级 30 分钟，
# 一条用例挂死就烧穿整个预算且 cancel 日志不指认元凶。60s 覆盖实测最重的离线用例
# （~7s）还有十倍余量；真要更长的用例单独 @pytest.mark.timeout(180)。thread 法不依赖
# 信号 —— Windows 上 signal 法不可用，而本仓 Windows-first。
timeout = 60
timeout_method = "thread"
# `live` = 需要**真实模型/真实服务**的用例（一次 8B 抽取比其余 640 个用例加起来还贵，
# 且结果随模型版本漂移）。默认整条排除（见 addopts 与 scripts/gate.py），要跑它们用
# `pytest -m live`。登记在此是为了让拼错标记名直接报错，而不是静默地一个都不跑。
markers = [
    "live: 真机/真模型用例，默认不跑（pytest -m live 显式执行）",
]

[tool.coverage.run]
# 覆盖率口径的唯一出处（2026-10-04 审查快照「口径硬编码在脚本 + 只看行覆盖」那一格的落地）。
# 从前这些数字挂在 `scripts/pytest_with_evidence.py` 的命令行上（`--cov=rolecard_agent
# --cov-fail-under=85`），于是"量什么范围、量到多少算过"住在**跑它的那条命令**里 ——
# CI、夜间臂、人肉重跑各抄一份，漏抄的那份会安静地量出另一个数。现在只有一处声明。
branch = true  # 口径含分支：只看行覆盖会放过"if 只走过一边"那一大族失败路径 —— 正是那条
#               快照点名的现场（OCR 子进程超时、嵌入重试耗尽、rerank 降级全在低覆盖处）。
source = ["src/rolecard_agent"]
# **刻意没有 omit，也没有 precision**：`source` 已把范围钉死在这个包里（测试与 `__main__`
# 都不在其中，实测 `src/**/__main__.py` 根本不存在），再写一条匹配不到东西的 omit 就是
# 本仓反复收口的 dead config；小数位同理 —— 迁移前那条命令行什么都没写也是两位（pytest-cov
# 的默认值），写进配置只是把默认值伪装成政策。真有人改了默认精度，读数机那格会落成
# `coverage_percent_unreadable` 并让一致性红 —— 形状由那里守，不由一行配置守。
# 快照那行原写"source/omit 显式声明"，落的是"口径进配置 + 开 branch"这半句，差异记进账本。

[tool.coverage.report]
# 阈值 90（2026-10-07 第七刀从 85 抬上来）：开 branch 之后连补七格失败路径用例，全量档
# 实测基线 **93.74%**（1727 条用例 / 208s，win32）—— 快照那条"先落基线读数再定新阈值"
# 的前置条件到此满足。90 留 3.74pp 余量，够下一批错误路径用例的空间，又把"接近但没到"
# 的劣化挡住（旧的 85 在基线 93+ 时等于 8pp 无感余量，约 800 条语句不被任何门禁看见）。
# ⚠️ Linux runner 的含分支口径未量过（历史教训是两平台行覆盖口径差 0.15pp）；coverage 步
# 目前整步在 CI_SKIP 里、且本刀不碰 src/ 不触发全量档实跑，所以 90 这条线由本机与夜间臂
# 执行 —— 真要进 CI 臂，先去量一发 Linux 读数。
fail_under = 90

[tool.rolecard]
# 分模块地板（2026-10-07 覆盖率体系第八刀）：全局 fail_under 管平均，这里管**单文件**。
# 85 = 当天全仓最低值量出来的现状下限（core/tools/files.py 84.95 补齐后其余都 ≥85.19），
# 不是拍的数；此后新文件/新分支跌破即红（scripts/coverage_floor.py 执行，紧跟门禁覆盖率步）。
# **刻意不放 [tool.coverage.report]**：coverage.py 对自家表里不认识的键每个用例都报
# CoverageWarning（实测确认）；本表在 coverage 的命名空间之外，tomllib 照读、coverage 无视。
# 这个数字**不进散文**（README/总览/流程只写全局阈值）—— 少一处家就少一处要同步的漂点。
coverage_floor = 85
# 改动行覆盖率（2026-10-07，diff-cover 那半，scripts/diff_coverage.py 执行）：基线
# origin/main，只问"这堆要进 main 的改动被验过没有" —— 全局与地板都看不见"新分支一条没测"
# 这件事。95 = 落地当天实测（2840 可测改动行、138 行零星欠账 → 95.14%），量出来的现状
# 下限；push 后基线自动前移、规则不改。与 coverage_floor 同在本表：同一条"配置在 coverage
# 命名空间之外 + 数字不进散文"的纪律。
diff_coverage_floor = 95

[tool.mypy]
python_version = "3.13"
packages = ["rolecard_agent"]
# 源码是 src/ 布局，而 CI 用 requirements*.txt 安装（不做 `pip install -e .`），
# 所以 mypy 必须被显式告知去哪找包 —— 否则报 "Can't find package 'rolecard_agent'"
# 而**看起来像通过**（这才是最坏的结果：一个从不生效的类型检查）。
# 与 [tool.pytest.ini_options] 的 pythonpath 是同一个理由。
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
# 起步阶段刻意宽松：不要求第三方库有类型存根、不因可选依赖缺失而报错。
# 目标不是"零告警的洁癖"，而是"类型标注这件事有机器兜底，不会随提交漂移"。
follow_imports = "silent"
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true

# ---------------------------------------------------------------- 依赖方向契约（import-linter）
#
# 为什么要有这一段：`core ↔ rag`、`core ↔ roles` 两条双向边是审查点名要收口的横向抓取，
# 而它们当时**靠函数里的延迟 import 压着不炸环** —— 于是"顺手把 import 提到模块顶层"
# 这种看起来无害的重构就能引爆循环导入，没有任何尺子会提前出声。这一段把方向从口头约定
# 变成必须评审的机器门禁（判据：`docs/架构总览.md` §5 第 1 条）。
#
# 分层（高层可以 import 低层，反过来一律红）：
#     api → domains → (features) → core → {roles | rag} → base → storage → config
# 两个刻意的取向：
#   * `roles | rag` 那一行的 `|` 是 import-linter 的**同层互不依赖**语法 —— 插件包彼此
#     不许打听（`rag` 用 `roles` 的卡、`roles` 用 `rag` 的库，都是把换掉一个包的成本
#     藏进另一个包）。
#   * `base` 在 `core` **之下**：它收的是"谁都要问一遍"的零业务知识原语（文本取值 /
#     来源标记 / 路径发现 / 观测出口 / 身份 / 审计咽喉 / 执行期注入的 ContextVar）。
#     这些件从前住在 core，于是 rag / roles 想借一把就得反向 import 内核 —— 两条双向边
#     就是这么长出来的。放到底层之后"反向"在结构上构不出来。
#   * `domains` 现在还在 `core` 之上。P1-5 两个阶段（`fc4e222` DomainSpec + 目录枚举、
#     `d4cbe4b` router_contrib + 协议瘦身）已经把域名单与域路由都从 api 装配点里拿掉，
#     但**翻格到 core 之下还差前置条件**：`domains/registry.py` 拼的是内核工具
#     （core.tools.* / core.memory / core.consensus）、`domains/health/tools.py` 用 core 的
#     件 —— 现在翻会让这些 `domains → core` 当场变红。翻层要与「core 经 Spec 认域」（core
#     侧自己 discover_specs）一起做；在那之前这一行不动，`core/ no domain token` 继续替内核
#     把关。判据见 docs/修复交接（2026-10-04）第四节第 3 条末尾的「残留」。
#   * `(features)` 是 proactive / sync / pets 拆出来之后的位置（P2-1），现在还不存在，
#     写成 optional 让契约先于施工生效。**方向以探针实测过（03:4x）**：功能包 import
#     内核必须放行、内核 import 功能包必须红 —— 这一格因此排在 `core` **之上**（快照
#     §7 终态图里 api→features→core）。从前它被写在 `core` 之下，等于契约替施工预先
#     判红：谁真把 reachout/sync 迁进 features/，第一趟 import-linter 就炸在方向上。
#     （optional 的意思是"包不存在时这一格不参与判定"，不是"方向还没定"。）
#
# 豁免纪律：`ignore_imports` 只许用来**固化现状**，每一条都要写清"哪一步会把它删掉"；
# 删干净之后这一段应当是空的。`unmatched_ignore_imports_alerting = error` 是配套的：
# 豁免名单里留着一条已经不再存在的边，同样红 —— 防止它变成垃圾桶。
[tool.importlinter]
root_packages = ["rolecard_agent"]

[[tool.importlinter.contracts]]
name = "依赖方向：api → domains → (features 可选) → core → {roles|rag} → base → storage → config"
type = "layers"
layers = [
    "rolecard_agent.api",
    "rolecard_agent.domains",
    "(rolecard_agent.features)",
    "rolecard_agent.core",
    "rolecard_agent.roles | rolecard_agent.rag",
    "rolecard_agent.base",
    "rolecard_agent.storage",
    "rolecard_agent.config",
]
unmatched_ignore_imports_alerting = "error"
ignore_imports = []

# 第二条契约：包内**任何两个模块之间都不许有环**。
# 上面那条管的是"包与包的方向"，这一条管的是"同一个包内部不许靠延迟 import 压环" ——
# `rag/ocr.py ↔ rag/parser.py` 正是后者的形状：parser 只在 `TYPE_CHECKING` 里 import ocr
# 拿 `OcrBackend` 做标注，ocr 顶层 import parser 拿两个异常名。导入不炸，但方向是环，
# 而"谁先 import 谁"这件事从此取决于调用顺序 —— 一次顺手把 lazy import 提到顶层的
# 重构就会炸，而且炸在运行时而不是评审时。判据：把类型协议挪到被依赖的一侧，环自然消失。
[[tool.importlinter.contracts]]
name = "包内无循环导入（延迟 import 压住的环也算）"
type = "acyclic_siblings"
ancestors = ["rolecard_agent"]
depth = 12
