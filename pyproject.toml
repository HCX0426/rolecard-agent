[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rolecard-agent"
version = "0.3.0"  # 与 api/main.py 的 FastAPI version 保持一致（v2.3 完成）
description = "Role-card driven conversational agent kernel with pluggable domain modules"
readme = "README.md"
# Declared floor = what we actually test. Development and CI run 3.13 (C:\.venv & CI images).
requires-python = ">=3.13"
license = { text = "MIT" }

# v1 core only. FastAPI / chromadb / rapidocr live in requirements-*.txt
# so that a v1 install never pulls the OCR stack (see C2).
dependencies = [
  "langchain==1.4.0",
  "langgraph==1.2.11",
  "langchain-core>=1.6.0",
  "langchain-ollama>=1.1.0",
  # 与 requirements.txt 同一条钉版口径（那边记着钉版原因）：检查点表是"会话的全部真相"，
  # 上游 layout 变更在本机不会有任何信号。两处约束必须逐字一致 —— parity 尺子比的就是这个
  # （2026-10-04 审查快照：此前这里裸奔，而 requirements 钉 ==3.1.1，漂移已实际发生）。
  "langgraph-checkpoint-sqlite==3.1.1",
  "pydantic>=2.13",
  # v2.4 联网与工作区工具（core/tools/web.py / files.py）：
  # 全部用活跃维护的独立轮子，不走已 sunset 的 langchain-community。
  "ddgs>=9.0",
  "trafilatura>=2.0",
  "tavily-python>=0.8",
  # 此前靠传递依赖兜住、被「依赖分层」检查抓成红的直接依赖（R28-11）：
  "httpx>=0.27",
  "typing_extensions>=4.12",
]

[project.optional-dependencies]
api = ["fastapi>=0.141", "uvicorn[standard]>=0.52", "python-multipart>=0.0.20"]
rag = ["chromadb>=1.5.9", "pypdf>=4.0"]
# Any OpenAI-compatible endpoint (DeepSeek / 通义 / Moonshot / 智谱 / OpenAI) goes through
# this one provider package. Kept optional so a local-only install stays offline-capable.
cloud = ["langchain-openai>=1.6.2"]
# OCR is deliberately NOT an extra: the OCR engine must run in a separate venv/process.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=7", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/rolecard_agent"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
# docs/ holds documentation, including archived design docs with illustrative code blocks.
# ruff can format fenced code inside Markdown, but reformatting historical docs is pure
# churn - and in the archive it is actively wrong, since those snippets are intentionally
# left as they were written.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# B008 会误报 FastAPI 的 `x: T = Depends(...)` —— 那正是框架要求的写法（依赖注入靠
# 默认值签名表达），不是"在默认参数里做函数调用"的坏味道。按官方建议登记为不可变调用。
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q -m 'not live'"
# 单条用例挂死的保险丝（2026-10-04 审查快照）：从前唯一防线是 job 级 30 分钟，
# 一条用例挂死就烧穿整个预算且 cancel 日志不指认元凶。60s 覆盖实测最重的离线用例
# （~7s）还有十倍余量；真要更长的用例单独 @pytest.mark.timeout(180)。thread 法不依赖
# 信号 —— Windows 上 signal 法不可用，而本仓 Windows-first。
timeout = 60
timeout_method = "thread"
# `live` = 需要**真实模型/真实服务**的用例（一次 8B 抽取比其余 640 个用例加起来还贵，
# 且结果随模型版本漂移）。默认整条排除（见 addopts 与 scripts/gate.py），要跑它们用
# `pytest -m live`。登记在此是为了让拼错标记名直接报错，而不是静默地一个都不跑。
markers = [
    "live: 真机/真模型用例，默认不跑（pytest -m live 显式执行）",
]

[tool.mypy]
python_version = "3.13"
packages = ["rolecard_agent"]
# 源码是 src/ 布局，而 CI 用 requirements*.txt 安装（不做 `pip install -e .`），
# 所以 mypy 必须被显式告知去哪找包 —— 否则报 "Can't find package 'rolecard_agent'"
# 而**看起来像通过**（这才是最坏的结果：一个从不生效的类型检查）。
# 与 [tool.pytest.ini_options] 的 pythonpath 是同一个理由。
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
# 起步阶段刻意宽松：不要求第三方库有类型存根、不因可选依赖缺失而报错。
# 目标不是"零告警的洁癖"，而是"类型标注这件事有机器兜底，不会随提交漂移"。
follow_imports = "silent"
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
