name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 依赖按范围拆分，要装全：内核 + 开发 + 接入层 + 检索（chromadb/pypdf）。
      # 漏装 rag 会让 test_rag / test_parser 直接 ImportError（此前从未真正跑过 CI，故未暴露）。
      # 注意：CI 实际装的是 requirements*.txt（无上界 pin）。2026-09-17 起弃用 uv、
      # 删除 uv.lock —— 本仓库无任何锁文件，版本漂移由每次干净安装暴露（见
      # docs/全项目审查报告 P1-14 与 docs/技术评审与决策.md §5 E3）。
      # 刻意不引入工具链，只依赖 pip。
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt \
                      -r requirements-api.txt -r requirements-rag.txt
      - name: Lint
        run: ruff check .
      - name: Type-check
        # 此前 `[tool.mypy]` 配置一直躺在 pyproject.toml 里却从不运行 —— 死配置比没有更糟
        # （看起来有兜底，其实没有）。跑起来之后第一次就报出 47 处真实问题（代码审查报告
        # （第二轮）F2），包括"28 处连接注解写的类型和实际传入的不一致"。
        run: mypy
      - name: Type-check scripts/
        # 取证尺子也在类型范围内：`mypy scripts/` 接进门禁的**第一天**就抓到
        # `seed_demo_data.py` 与 `run_eval.py` 运行时已经坏了（少两个必填关键字参数）。
        # CI 不跑它 = 只有我这台机器知道那两个脚本其实是死的（09-26 轮 R26-21/S-6′）。
        run: mypy scripts/
      - name: Tests (offline, no Ollama needed)
        # 覆盖率阈值 85%：低于它说明有人在没补测试的情况下大幅加代码。
        # 真正的意义是"重构前的安全网"—— 拆 api/main.py 这类改动，没有覆盖数据是闭眼改。
        run: |
          python -m pytest -q -p no:cacheprovider \
            --cov=rolecard_agent --cov-report=term-missing --cov-fail-under=85
      - name: Consistency (docs ↔ code)
        run: python scripts/check_consistency.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Unit tests (api 层契约 + SSE 归约 + 上传三态 + ChatPage 接线)
        # 覆盖三类，按"越靠近用户越难测"排列：
        #   api.test.ts        请求序列化 / 错误归一化 / abort 语义（node 环境）
        #   lib/*.test.ts      SSE 帧切分与事件归约、上传结局文案（纯函数）
        #   pages/*.test.tsx   真实渲染 ChatPage，断言流式文本、工具卡片、上下文提示（jsdom）
        run: npm test
      - name: Type-check + build
        run: npm run build

  shell:
    # 桌面壳（Electron 主进程 + preload）此前**全程无人检查**：门禁只 `cd frontend`，
    # CI 里 shell 命中数为 0（09-26 轮 R26-21 的第一块空白）。壳那侧的类型错最典型的后果
    # 不是编译不过，而是"装到机器上才发现"——托盘退出被一扇模态错误框堵 80 秒就是那一族。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        # typecheck 用不到 Electron 的二进制（那 ~100 MB 是给打包用的），跳过下载只装 tsc 与 @types。
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-fund --no-audit
      - name: Type-check
        run: npm run typecheck

  # **刻意不放进 CI 的两条**（写在这里是为了别再加回来）：
  #   · `scripts/baseline.py --check` —— 它按构造就要读"装好的那份数据根"
  #     （`build()` 里 `next(p for tag, p in data_roots().items() if tag.startswith("installed"))`），
  #     runner 上没有这个根，硬塞只会 StopIteration。它的家是**本地门禁**。
  #   · "dist 与提交一致"（门禁的 `dist 入库同步`）—— 那条比的是同一台机器同一套 node 的产物，
  #     换 runner 的 node/minifier 版本会让哈希漂一下，于是**误报一次就没人信这条**。
  #   · 真机冒烟（浏览器 + 桌宠 + 模型）—— 需要桌面会话与真后端，本就不是 CI 的活。
