name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 依赖按范围拆分，要装全：内核 + 开发 + 接入层 + 检索（chromadb/pypdf）。
      # 漏装 rag 会让 test_rag / test_parser 直接 ImportError（此前从未真正跑过 CI，故未暴露）。
      # 可复现性由 uv.lock 保证（本地/CI 均可用 `uv sync --locked`）；这里用 requirements 镜像
      # 是为了不在 CI 里额外引入工具链。
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt \
                      -r requirements-api.txt -r requirements-rag.txt
      - name: Lint
        run: ruff check .
      - name: Tests (offline, no Ollama needed)
        # 覆盖率阈值 85%：低于它说明有人在没补测试的情况下大幅加代码。
        # 真正的意义是"重构前的安全网"—— 拆 api/main.py 这类改动，没有覆盖数据是闭眼改。
        run: |
          python -m pytest -q -p no:cacheprovider \
            --cov=rolecard_agent --cov-report=term-missing --cov-fail-under=85
      - name: Consistency (docs ↔ code)
        run: python scripts/check_consistency.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Type-check + build
        run: npm run build
