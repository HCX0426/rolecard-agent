name: CI

# 这套 workflow 的存在理由（v2.4 三件之一）：在此之前**仓库没有远端**，所以"CI 绿"从来
# 只是本地推断 —— 没有任何一台机器真跑过门禁。第一次跑通之后，`架构总览 §4` 那条欠账
# 才从"没验过"变成"验过"。
#
# 为什么调 `scripts/gate.py` 而不是在这儿重编一遍命令：门禁口径只有一处定义，CI 与本机
# 跑的必须是同一套东西；否则"CI 绿"和"提交前绿"会说两套话（这条与 S-1 那个
# "值列只有一处派生"是同一个理由）。
#
# **runner 一律钉到具体版本，不用 `ubuntu-latest`**（10-02 钉的）。GitHub 公告
# `ubuntu-latest` 将于 2026-10-19 迁到 Ubuntu 26，而这条 workflow 里有两处会跟着镜像一起漂：
# 覆盖率是按平台量的数（入库读数就带着"哪台机器"的身份），以及 chromadb / sqlite-vec /
# onnxruntime 这一族原生 wheel。钉死成今天实际解析到的那一版（ubuntu-24.04，2026-10-02
# 从上一发成功 run 的日志里现读 `ImageOS` 确认）= **今天零行为变化，只把 10-19 那次静默换底
# 挡在门外**。要升级镜像就显式改这一行并同趟重量读数，别让标签替你改。
# `windows-latest` 刻意不钉：那一 job 只由手动 `build_windows` 触发、产物不参与 CI 绿，
# 而且本机打的才是出货那一份。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_gate:
        description: "额外跑一遍全量门禁（覆盖率≥85% + 离线冒烟 + 壳 typecheck）"
        type: boolean
        default: true
      build_windows:
        description: "打一发 Windows 安装包（产物进 artifact，不装进任何机器）"
        type: boolean
        default: false

permissions:
  contents: read

# 同一条分支上只跑最新一次：连推几发时旧的那次没有价值，而 docker job 每次都要拉基座镜像。
# `cancel-in-progress` 只取消**同一 ref** 的旧运行，PR 与 main 互不干扰。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8 # 中文与「▶」在管道输出上会撞 GBK，见 gate.py 那段编码注释
  PYTHONUNBUFFERED: "1"

jobs:
  gate:
    name: 门禁 --ci（含覆盖率≥85% 与 baseline 比对）
    runs-on: ubuntu-24.04
    # 每条 job 都要有 timeout（09-28 轮 `R28-25`：四条无一设过，任一挂死就默认烧满 360 分钟）。
    # 预算按**实测用时**给，不是拍脑袋：本地 --ci 档 320s，CI 上实测 5m15s，留一倍余量防抖动，
    # 又远小于默认值 —— 挂死的作业该在几分钟内变成一次红，而不是一次"没跑完"。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          # 与 Dockerfile 的 `python:3.13-slim` 同一条版本线：CI 绿而镜像里是别的版本，
          # 就等于两次实测互相不覆盖。
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-rag.txt
            requirements-cloud.txt
            requirements-mcp.txt
            requirements-dev.txt

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          # rag 必须与 api 一起装：漏了它，知识库 / 上传解析 / 检索工具在用例里 ImportError
          # —— 与 Dockerfile 第 12 行记的是同一个坑。
          # cloud 也要：集成测试里的模型后端就是 OpenAI 兼容端点（硅基流动），漏装的症状
          # 是 PUT /api/settings/models 500 —— CI 第 1、2 发实跑抓到的就是这个。
          # mcp 自 10-01 起在同一批里（`R28-53`）：随包后端与镜像都装着它，CI 环境与两条
          # 出货路径对齐之后，`installer scope parity` 那条断言才在所有入口上同一口径。
          pip install -r requirements.txt -r requirements-api.txt \
            -r requirements-rag.txt -r requirements-cloud.txt \
            -r requirements-mcp.txt -r requirements-dev.txt

      - name: gate.py --ci
        # 用户 09-29 拍的：覆盖率与 baseline 比对**不留在手动档**，每次 push/PR 都设防
        # （R28-24）。--ci = 全量层去掉需要 node/浏览器/真机的那几步（它们各有专属 job），
        # 且覆盖率不因"src 无改动"跳过。口径只在 gate.py 一处。
        # GATE_READINGS_SCRATCH：runner 的读数写进 gitignore 的 build/，**不覆盖入库那份**
        # （R28-74）。覆盖率是按平台的数 —— 本机 win32 91.92% / runner Linux 91.77%，
        # 让 runner 回写就等于两份都对的数互相把对方判成漂移。
        env:
          GATE_READINGS_SCRATCH: "1"
        run: python scripts/gate.py --ci

  frontend:
    name: 前端（tsc + build + vitest）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            shell/package-lock.json

      - name: 装依赖
        working-directory: frontend
        run: npm ci

      - name: 壳 typecheck（`R102-63`：此前只在手动 full 门禁跑，push 路径无人看着）
        working-directory: shell
        run: npm ci && npm run typecheck

      - name: 构建（`npm run build` 里含 tsc --noEmit）
        working-directory: frontend
        run: npm run build

      - name: 用例
        working-directory: frontend
        run: npm test

      - name: dist 必须与源码同步（入库那份不能是旧的）
        # 后端托管的正是 `frontend/dist`，而且它被有意入库（clone 后不装 node 也能起控制台）。
        # 改了前端却没重建 = 源码是新的、镜像与安装包带的是旧界面，而且它不报任何错。
        run: |
          # 这一条**不在这里写判据**（09-28 轮 `R28-31`）：从前这里是一条 `git diff --quiet`，
          # 而本机 `gate.py` 那条是 `git status --porcelain` —— 后者看得见未跟踪的新产物，
          # 前者看不见，于是"构建只净增改名后的 chunk"这种形状 CI 空过、本机红。
          # 一条检查在两个地方各写一遍迟早漂开，所以现在两边调同一个脚本
          # （runner 上的系统 python3 就够：它只跑 git，不装任何依赖）。
          python3 scripts/check_dist_sync.py

  docker:
    name: 镜像真跑（build + 起 + 护栏 + 一次真 API 往返）
    runs-on: ubuntu-24.04
    # 构建镜像这一段本来就慢（拉基座 + pip 装四份 requirements），预算给到 25 分钟。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t rolecard-agent:ci .

      - name: 部署面那份 compose 要能解析（v2.4 收官那一档）
        # 这台 runner 才有 Docker —— 本机连 `docker` 都没有，所以 compose 的语法与"必填变量
        # 缺了会怎样"只有在 CI 上量得到。`config -q` 顺带把 `${VAR:?}` 那几条护栏演一遍：
        # 先不给变量 ⇒ 必须非零退出并说"缺变量"；补齐之后 ⇒ 必须安静通过。
        run: |
          set +e
          out=$(docker compose config -q 2>&1); code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "compose 在没给任何变量时竟然解析通过了 —— 那三条 :? 护栏是空的"; exit 1
          fi
          printf '%s\n' "$out" | grep -qi "required variable" || {
            echo "非零退出，但不是因为那三条 :? 护栏：$out"; exit 1
          }
          # 判据只认"报了缺变量"这个通用形状，**不点名是哪个** —— compose 按服务顺序插值，
          # 先撞到 app.environment 的 ROLECARD_CREDENTIALS（09-30 实测），我原先 grep 的是
          # ROLECARD_DOMAIN，等于把判据写在"实现先碰到谁"这个细节上，一推就红。
          ROLECARD_DOMAIN=chat.example.invalid \
          ROLECARD_CREDENTIALS='operator:ci:ci-pass' \
            docker compose config -q
          ROLECARD_DOMAIN=chat.example.invalid \
          ROLECARD_CREDENTIALS='operator:ci:ci-pass' \
            docker compose config --services | sort | tr '\n' ' '
          echo

      - name: 公网护栏必须是硬的（不带鉴权就该拒绝启动，而不是默默裸奔）
        # 这条把 `api/main.py` 那段"非回环 + AUTH_MODE=off = RuntimeError"从**读代码得到的
        # 断言**变成**测出来的事实**。两种失败分开报：起来了 = 护栏没生效；非零退出但退因
        # 不是那句 = 别把环境问题报成断言失败。
        run: |
          set +e
          out=$(docker run --rm rolecard-agent:ci 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out" | tail -20
          if [ "$code" -eq 0 ]; then
            echo "护栏没生效：裸容器竟然起来了"; exit 1
          fi
          printf '%s\n' "$out" | grep -q "拒绝启动" || {
            echo "容器非零退出，但退因不是那条护栏 —— 看上面的日志"; exit 1
          }

      - name: 带鉴权起容器并走一遍真链路
        run: |
          docker run -d --name rc \
            -e AUTH_MODE=on -e AUTH_CREDENTIALS=ci-user:ci-pass \
            -e MODEL_BACKENDS='{"local": {"model": "none", "provider": "ollama", "base_url": "http://127.0.0.1:9"}}' \
            -v rc-data:/app/data -p 8000:8000 rolecard-agent:ci
          # 等就绪。/api/health 是鉴权豁免项，所以这里不带凭据 —— 顺带钉住"豁免的那条确实是豁免"。
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
            if [ "$i" = "45" ]; then echo "90 秒内没就绪"; docker logs rc; exit 1; fi
          done
          # 无凭据打数据面必须 401：认证是**中间件**，覆盖含静态资源在内的全部请求
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/sessions)
          if [ "$code" != "401" ]; then echo "期望 401，实际 $code"; docker logs rc; exit 1; fi
          # 开会话 → 读列表：走的是真 FastAPI + 装配根 + sqlite（挂在卷上），不是替身
          tid=$(curl -fsS -u ci-user:ci-pass -X POST http://127.0.0.1:8000/api/session \
            -H 'Content-Type: application/json' -d '{}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["thread_id"])')
          echo "新建会话：$tid"
          curl -fsS -u ci-user:ci-pass http://127.0.0.1:8000/api/sessions | grep -q "$tid" || {
            echo "列表里读不到刚建的那条"; docker logs rc; exit 1
          }
          # 控制台首页由后端从**镜像里那份 dist** 托管：证明"不装 node 也能起界面"这条在容器里成立
          curl -fsS -u ci-user:ci-pass http://127.0.0.1:8000/ | grep -q 'id="root"' || {
            echo "首页没有挂载点，dist 没进镜像或没被托管"; docker logs rc; exit 1
          }
          # 存一个 OpenAI 兼容后端 —— 这是这个镜像的**主用例**（容器里没有 Ollama，云端 key
          # 才是它的模型来源）。CI 第 2 发就是这条 500：镜像漏装 langchain-openai，本机没红
          # 只是 .venv 恰好装过。构建失败的可读原因在响应体的 detail 里，所以失败时原样打印。
          # base_url 不在这里抄第二遍（`R102-39`）：从 config.py 现读（runner 的 python3 只
          # 做标准库 import，装不装依赖无关）。
          SF_BASE_URL=$(python3 -c "import sys; sys.path.insert(0, 'src'); from rolecard_agent.config import DEFAULT_SILICONFLOW_BASE_URL; print(DEFAULT_SILICONFLOW_BASE_URL)")
          put=$(curl -s -u ci-user:ci-pass -X PUT http://127.0.0.1:8000/api/settings/models \
            -H 'Content-Type: application/json' \
            -d "{\"default\":\"sf\",\"backends\":[{\"name\":\"sf\",\"provider\":\"siliconflow\",\"base_url\":\"$SF_BASE_URL\",\"model\":\"ci-model\",\"api_key\":\"sk-ci-not-a-real-key\",\"usage\":\"chat\"}],\"fallbacks\":[]}")
          printf '%s' "$put" | grep -q '"default"' || {
            echo "容器内存一个云端后端失败：$put"; docker logs rc; exit 1
          }
          # R28-29：镜像必须以非 root 跑，而且 HEALTHCHECK 要**真报过 healthy**。
          # 放在最后是因为上面已经往卷里写过两次（一条会话、一个后端行）—— "非 root 写得动数据"
          # 到这一刻才是被跑出来的事实，而不是从 Dockerfile 那几行推出来的。
          uid=$(docker exec rc python -c 'import os; print(os.getuid())')
          if [ "$uid" = "0" ]; then echo "容器还在以 root 跑（uid=0）"; docker logs rc; exit 1; fi
          echo "容器内进程 uid=$uid（不是 0）"
          healthy=""
          for i in $(seq 1 12); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' rc)" = "healthy" ]; then healthy=1; break; fi
            sleep 4
            if [ "$i" = "12" ]; then echo "48 秒内 HEALTHCHECK 没报过 healthy"; fi
          done
          if [ -z "$healthy" ]; then
            docker inspect -f '{{json .State.Health}}' rc
            echo "对编排器来说它还是个黑盒 —— HEALTHCHECK 形同虚设"; exit 1
          fi
          echo "容器内：以 uid=$uid 运行 / HEALTHCHECK=healthy"
          echo "容器内：健康 200 / 无凭据 401 / 建会话可读回 / 首页托管自镜像内 dist / 可存云端后端"

      - name: 镜像里那几族运行时依赖必须真装上了（R28-53）
        # 同族的病已经红过三次：CI 第 2 发（镜像漏 cloud ⇒ 配任何 OpenAI 兼容端点保存即 500）、
        # 09-29 桌面包（spec 漏 mcp ⇒ 打包态 MCP 永远 fail-open）、10-01 镜像（Dockerfile 只收四份，
        # 而随包后端的清单是五份）。三次共同的形状是**本机绿、镜像缺**：构建机的 .venv 恰好装过。
        # 清单不在这里重抄 —— 从 packaging/rolecard-backend.spec 现读 RUNTIME_PACKAGES，与那条
        # "缺一条就拒绝出产物"的护栏同一个源头（口径唯一；读不到就直接红，不然这条会静默变成零判据）。
        run: |
          pkgs=$(python3 - <<'PY'
          import ast, pathlib
          tree = ast.parse(pathlib.Path("packaging/rolecard-backend.spec").read_text(encoding="utf-8"))
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign) and any(
                  getattr(t, "id", "") == "RUNTIME_PACKAGES" for t in node.targets
              ):
                  print(" ".join(ast.literal_eval(node.value)))
                  break
          PY
          )
          if [ -z "$pkgs" ]; then
            echo "没从 spec 里读出 RUNTIME_PACKAGES —— 这条验货与 spec 里那条护栏会一起失效"; exit 1
          fi
          echo "要问镜像的这几族：$pkgs"
          for m in $pkgs; do
            if ! docker exec rc python -c "import $m" >/dev/null 2>&1; then
              echo "镜像里 import $m 失败 —— Dockerfile 少装了它这一族"; docker logs rc 2>&1 | tail -8; exit 1
            fi
          done
          echo "镜像内这几族全部可导入：$pkgs"

      - name: 收尾
        if: always()
        run: |
          docker logs rc 2>&1 | tail -12 || true
          docker rm -f rc >/dev/null 2>&1 || true

  full-gate:
    name: 全量门禁（手动触发才跑）
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_gate }}
    needs: [gate, frontend]
    runs-on: ubuntu-24.04
    # 全量档含真机冒烟与壳 typecheck，本地实测 6~8 分钟；给 30 分钟。
    timeout-minutes: 30
    env:
      # 浏览器那段要本机 Chrome + playwright-core，runner 上没有对应物；显式跳过并**在日志里
      # 带上原因**，别让"没跑到"被读成"全绿"（gate.py 与 smoke_check 都是这个口径）。
      SMOKE_SKIP_UI: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-rag.txt
            requirements-cloud.txt
            requirements-mcp.txt
            requirements-dev.txt

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            shell/package-lock.json

      - name: 装依赖（后端 + 前端 + 壳）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt \
            -r requirements-rag.txt -r requirements-cloud.txt \
            -r requirements-mcp.txt -r requirements-dev.txt
          npm ci --prefix frontend
          npm ci --prefix shell

      - name: gate.py 全量（覆盖率≥85% + 前端 + 壳 + 离线冒烟）
        # 同 `--ci` 那一步：runner 的读数不落进入库那份（R28-74，理由写在那儿）
        env:
          GATE_READINGS_SCRATCH: "1"
        run: python scripts/gate.py

  windows-release:
    name: 发布链（Windows 安装包，只在手动触发时跑）
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_windows }}
    # 门禁与 dist 同步先绿：不然这条会发一个"里面是旧界面"的包出去（第十二包真踩过，
    # 见 docs/开发流程.md 那段「② 吃的是 ① 的产物」）。
    needs: [gate, frontend]
    runs-on: windows-latest
    # 为什么是 dispatch-only 而不是每次 push 都跑：Windows runner 的分钟按 Linux 的 2× 计费，
    # 而它产出的东西不参与"CI 绿不绿" —— 它是**待发的那个包**。09-28 轮 `R28-32` 的原话是
    # "随包后端质量只靠台账"：本机打一发要两小时，没人会每改一次打一次，于是安装包质量
    # 全靠人记得跑那四步。现在它靠这条 job：点一下按钮就有过机器核对的一发包。
    # 预算按各步实测给：装依赖 ≈3 分钟、PyInstaller ≈2~3 分钟（本机实测）、
    # electron-builder ≈2~4 分钟（含下 electron 与 NSIS 二进制），留一倍余量。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-rag.txt
            requirements-cloud.txt
            requirements-mcp.txt
            requirements-package.txt

      - name: 装打包机依赖（运行时五族 + PyInstaller）
        # 那五族不是罗列：`packaging/rolecard-backend.spec` 会对 RUNTIME_PACKAGES 逐条
        # `find_spec`，缺一条就**拒绝出产物**（`R28-34`）—— 因为 `collect_submodules()`
        # 对没安装的包返回空列表且不报错，少装一族的代价正是"构建成功、里面缺东西"。
        # `requirements-package.txt` 就是这一条 job 的前置：PyInstaller 从前没写在任何
        # requirements 里，所以 fresh clone + CI 根本打不出包（这轮才发现）。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt -r requirements-rag.txt -r requirements-cloud.txt -r requirements-mcp.txt -r requirements-package.txt

      - name: 装 Node（只装壳那一份）
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shell/package-lock.json

      - name: 界面产物用入库那份 dist，这里不重 build
        # dist 是有意入库的第二份事实（clone 后不装 node 也能起控制台），而"入库那份是不是
        # 当前的"由 frontend job 的 `check_dist_sync.py` 把关；这条 job `needs: frontend`，
        # 走到这里时它是绿的。在这里再 build 一次是重复付费（npm ci + vite），而判据已经有人
        # 把着 —— 口径唯一，与 `R28-31` 同一个理由。
        # `build_sidecar.py` 自己会在缺 dist 时拒绝出产物（退出码 2），这里先说清是哪一步的锅。
        shell: pwsh
        run: |
          if (-not (Test-Path frontend/dist/index.html)) {
            throw "入库的 frontend/dist 不见了 —— ②（build_sidecar）会直接拒绝出产物"
          }

      - name: 打随包后端（②）
        run: python scripts/build_sidecar.py

      - name: 事后尺子：src import 的每一族都在包里（R28-34）
        run: python scripts/check_bundle_parity.py

      - name: 随包后端起一次并答 /api/health
        # 整条 job 的意义就在这一步：**没装过任何依赖的机器上**，那个 exe 能不能起成一个真答话
        # 的后端。本机验收时它是 install_package.ps1 的第④道，而 CI 上不必装进系统也能量同一
        # 件事 —— 直接跑 build/sidecar 里那份 exe，端口与判据都跟那道一致（不另起一套口径）。
        # 只 Stop-Process 自己 Start-Process 拿到 pid 的那个进程。
        shell: pwsh
        env:
          DATA_ROOT: ${{ runner.temp }}/rc-sidecar-data
          MODEL_PIN_ON_STARTUP: "0"
        run: |
          $exe = "build/sidecar/rolecard-backend/rolecard-backend.exe"
          if (-not (Test-Path $exe)) { throw "没有 $exe —— ② 没产出可执行后端" }
          $p = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          $body = ""
          try {
            for ($i = 1; $i -le 45; $i++) {
              Start-Sleep -Seconds 2
              if ($p.HasExited) { throw "随包后端起了又退（exit=$($p.ExitCode)），第 $i 次探测" }
              try {
                $h = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -TimeoutSec 5
                if ($h.StatusCode -eq 200) { $body = $h.Content; break }
              } catch { }
            }
            if (-not $body) { throw "90 秒内 /api/health 没答 200" }
            Write-Host "随包后端答了：$body"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: 打 NSIS 安装包（④）
        working-directory: shell
        # 两条命令之间**逐条查退出码**（09-28 轮 `R28-26` 那条教训的 Windows 版）：pwsh 里
        # `a; b` 的这一步只认最后一条的返回码，于是 `npm ci` 失败被后面那条盖掉，报出来是
        # "electron-builder 找不到目录"这种指错地方的红。
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci 失败（exit=$LASTEXITCODE）—— 后面那步不该跑" }
          npm run package
          if ($LASTEXITCODE -ne 0) { throw "electron-builder 失败（exit=$LASTEXITCODE）" }

      - name: 产物核对并上传
        shell: pwsh
        run: |
          # 文件名里的版本来自 shell/package.json —— 那里禁止写死版本号（version parity 那条
          # 断言看着呢），所以这里用通配匹配，不再造第三个版本来源。
          $files = @(Get-ChildItem "shell/release/rolecard-agent-*-x64.exe" -ErrorAction SilentlyContinue)
          if ($files.Count -ne 1) {
            $seen = @(Get-ChildItem shell/release -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ", "
            throw "期望正好 1 个安装包，实际 $($files.Count)。shell/release 里是：$seen"
          }
          $mb = [math]::Round($files[0].Length / 1MB, 2)
          # 体积是一条**读数**，只有低得离谱才红：那意味着随包后端根本没进 extraResources
          # （② 成功但 ④ 指错了目录）。09-29 那一份是 192.03 MB，不拿它当断言 —— 它会随
          # 依赖版本漂，而漂了不等于坏。
          if ($files[0].Length -lt 60MB) { throw "安装包只有 $mb MB：随包后端多半没进 extraResources" }
          Write-Host "安装包 $($files[0].Name) = $mb MB"

      # 这条 job **不装进 runner**（装完还要起壳窗看健康，那是本机 install_package.ps1 的活，
      # 规矩见 docs/开发流程.md）。产物进 artifact，人要装就下载它再跑那条脚本。
      - uses: actions/upload-artifact@v4
        with:
          name: rolecard-agent-installer
          path: shell/release/rolecard-agent-*-x64.exe
          retention-days: 14
