name: Nightly

# 夜间臂（审查快照 P2-27 + P3-17，决策八）：定期跑真机冒烟 + 评测，证据落 docs/eval/。
# （10-27 起月度，见下方时间线注释；名字沿用 nightly —— 改 cron 不改名，历史 run 可追。）
#
# 为什么单独一条 workflow + 用 `schedule`（而非并进 ci.yml）：
#   * 它跑 `pytest -m live` + smoke_check（含 UI 段）+ run_eval，比日常 CI 那几档贵；
#   * 失败只报警不拦 PR（决策八原话）：夜里的偶发红不该把白天在飞的 PR 卡住，但证据要落盘
#     （docs/eval/ 的 JSON）让人第二天能查。
#
# **2026-10-27 改回 GitHub-hosted（windows-latest）**——死信 issue #11 逼出来的收口：
#   `runs-on: [self-hosted, windows]` 的"没注册即安静 skip"论证错了一格：GitHub 对
#   永远等不到 runner 的 schedule run 不是安静 skip，是**排队 24 小时然后整趟 cancelled**
#   ——10-21 起每晚如此，哨兵 10-27 立案时已经连中六晚。而 P2-27 的 10-10 复核早已量过
#   另一头：仓库 public ⇒ **托管 runner 免费不限量**，"self-hosted 省成本"的前提不成立；
#   真卡点从来不是缺机器，是缺一条云端 key（SILICONFLOW_API_KEY，仓库 secrets 数 = 0）。
#   所以：机器换成托管，**没 key 的晚上真模型段按设计红/空（continue-on-error 兜住），
#   状态证据照落**——臂从"每晚静默失踪"变成"每晚答话、缺什么写在证据里"。
#   哪天用户在 repo secrets 里配上 key，run_eval / measure_latency 的云端臂自动点亮，
#   这个文件一行都不用改。
#   UI 冒烟段（2026-10-26 分层决定里"交给 nightly 真机"那格）：托管 windows 镜像预装
#   Chrome/Edge，ui_smoke.js 按 Windows 路径自动探测；playwright-core 装进它认识的
#   %USERPROFILE%\uicheck 加载位（不下载浏览器，几 MB）。装不上就照设计打印跳过，不拦。
#
# **2026-10-27 再改：每月一次（用户拍板"单人项目一个月一次就够了"）**：
#   cron 取每月 1 号 UTC 03:00（北京 11:00，活跃时段 —— 红了当天就能看，与 lock-refresh
#   同一句话的理由）。跑在托管 runner 上，用户机器开不开与它无关。
#   哨兵阈值同步从"连续 2 晚"抬到"连续 35 天"（monthly + 一晚容错），不然月臂会被
#   日哨天天立案 —— 节奏是一对，拆开哪半边都会撒谎。

on:
  schedule:
    # 每月 1 号 UTC 03:00（北京 11:00，开发时段内 —— 红了当天就能看见）。
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write   # 证据 JSON 落 docs/eval/ 并提交（失败也留痕，方便回看）

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:
  live:
    name: 夜间真机验收（托管 windows）
    runs-on: windows-latest
    # 托管免费档按墙钟计费上限给到 3h；真装依赖 + 冒烟 + 评测实测在 30~60 分钟量级。
    timeout-minutes: 180
    continue-on-error: true   # 决策八：失败只报警不拦 PR（本 job 不进任何 PR 的 needs）
    env:
      # 缺 key 时下面各段自己红/空（continue-on-error 兜住）；配上即自动生效。
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: 装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/requirements.lock
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.lock
      - name: 装 playwright-core（UI 冒烟的驱动，不下载浏览器，用镜像自带的）
        run: npm install --prefix "$env:USERPROFILE\uicheck" playwright-core
      - name: 真机冒烟（含 UI 段）+ 真模型评测（run_eval）
        env:
          SMOKE_SKIP_UI: "0"
        run: |
          python scripts/smoke_check.py
          python scripts/tools/run_eval.py --strict --report docs/eval/nightly-${{ github.run_id }}.json
      # ── P3-17：质量验收脚本三件 + live 用例（此前**只写在本文件头的注释里、steps 没接** ——
      # 注释与现实对不上这件事本身就是 bug：这次把线接上，注释才成真。）
      - name: live 用例（真模型抽取；探不到就 skip 并写清缺什么，ENGI-17）
        run: python -m pytest tests -m live -q --no-header
      - name: 质量验收脚本三件（persona_meter / measure_latency / persona_ab）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path docs/eval | Out-Null
          $rid = "${{ github.run_id }}"
          # ── 铺取数世界（2026-10-29 收口，配上 key 的首趟真跑逼出来的第三层）──
          # 三件都读"**活用户库**"（scratch_db.resolve_live_db：LIVE_DB_PATH 覆盖 >
          # 仓库/安装根两根里较新者）——那是"改前/改后 diff"的语义：量的是真实使用攒下的
          # 开口与账本。托管 runner 上这个世界**从来没有存在过**，于是三件每晚齐死在
          # "找不到任何一份源库"，与 key 无关（key 只是让它们此前连死因都看不见）。
          # 这里现建一份最小演示世界（init_db --seed-domain-roles：全 schema + 出厂角色卡
          # + 域种子卡——2026-10-31 教义后开机不种域角色，persona_ab 默认点名 medical_archivist
          # 的夜间臂因此要显式种；run_eval 的评测环自己种，不经过这里），
          # LIVE_DB_PATH 把三件的取数钉到它；空历史是诚实读数（样本数 0、token 账空），
          # 有 key 时开口臂真发得出话（persona_ab 自带 run_api 同款云端引导）。
          New-Item -ItemType Directory -Force -Path build/scratch | Out-Null
          $env:SQLITE_PATH = "build/scratch/nightly-world.db"
          $env:CHROMA_PATH = "build/scratch/nightly-chroma"
          $env:LIVE_DB_PATH = "build/scratch/nightly-world.db"
          python scripts/init_db.py --seed-domain-roles
          if ($LASTEXITCODE -ne 0) { Write-Host "铺世界失败——三件今晚无量"; exit 1 }
          # persona_meter：只读库；--json 出机器可读（便于改前改后 diff）。
          python scripts/tools/persona_meter.py --json > "$env:TEMP\pm-$rid.json"
          if ($LASTEXITCODE -eq 0 -and (Get-Item "$env:TEMP\pm-$rid.json").Length -gt 2) {
            Move-Item "$env:TEMP\pm-$rid.json" "docs\eval\persona_meter-$rid.json" -Force
          } else {
            Write-Host "persona_meter 这晚没产出（不拦：决策八失败只报警）"
            Remove-Item "$env:TEMP\pm-$rid.json" -ErrorAction SilentlyContinue
          }
          # measure_latency：自带起停服务，stdout 即证据；n=5 控夜间成本。
          python scripts/tools/measure_latency.py --n 5 > "$env:TEMP\ml-$rid.txt"
          if ($LASTEXITCODE -eq 0 -and (Get-Item "$env:TEMP\ml-$rid.txt").Length -gt 0) {
            Move-Item "$env:TEMP\ml-$rid.txt" "docs\eval\measure_latency-$rid.txt" -Force
          } else {
            Write-Host "measure_latency 这晚没产出"
            Remove-Item "$env:TEMP\ml-$rid.txt" -ErrorAction SilentlyContinue
          }
          # persona_ab：要对着 8000 端口的 API —— 起一个、等健康、打完即杀（n=3×2 臂）。
          $srv = Start-Process python -ArgumentList "scripts\run_api.py" -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..90) {
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -TimeoutSec 2 | Out-Null
              $ok = $true; break
            } catch { Start-Sleep -Seconds 2 }
          }
          if ($ok) {
            python scripts/tools/persona_ab.py --n 3 > "$env:TEMP\pa-$rid.txt"
            if ($LASTEXITCODE -eq 0 -and (Get-Item "$env:TEMP\pa-$rid.txt").Length -gt 0) {
              Move-Item "$env:TEMP\pa-$rid.txt" "docs\eval\persona_ab-$rid.txt" -Force
            } else {
              Write-Host "persona_ab 这晚没产出"
              Remove-Item "$env:TEMP\pa-$rid.txt" -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "run_api 90×2s 等不到健康 —— persona_ab 这晚不量（不拦）"
          }
          if ($srv -and -not $srv.HasExited) { Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue }
      - name: 今晚答到（状态证据 —— 哨兵的"活着"判据，缺 key 也落）
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path docs/eval | Out-Null
          $status = [ordered]@{
            run_id          = "${{ github.run_id }}"
            sha             = "${{ github.sha }}"
            utc             = (Get-Date).ToUniversalTime().ToString("s") + "Z"
            siliconflow_key = [bool]"$env:SILICONFLOW_API_KEY"
            note            = "缺 key 的晚上：真模型段按设计红/空（continue-on-error 兜住）。" +
                              "本文件每晚必落 = 夜间臂答话的证据，哨兵盯它销案。"
          }
          $status | ConvertTo-Json | Set-Content -Encoding utf8 "docs\eval\status-${{ github.run_id }}.json"
      - name: 证据落盘
        if: always()
        shell: pwsh
        run: |
          if (Test-Path docs/eval) {
            git config user.name "HCX0426"
            git config user.email "chongxuan-huang@outlook.com"
            git add docs/eval
            if (git diff --cached --quiet) { Write-Host "今晚无新证据" } else {
              git commit -m "chore(eval): 夜间臂证据落盘（run_id=${{ github.run_id }}）"
              git pull --rebase origin main || true
              git push
            }
          }
