name: CodeQL 周臂（SAST）

# SAST 静态安全扫描（开发流程.md P13，2026-10-26）：gitleaks 管密钥、pip-audit 管依赖，
# 都不扫**自家代码**；对注入 / 反序列化 / 路径穿越这类模式化漏洞，CodeQL 的数据流分析
# 是机器覆盖里独立的一档（个人仓免费）。周级而不是每次 push：这条臂慢（初始化拉 ~100MB
# bundle + 双语言建库），而自家代码的安全语义变化是周级的节奏 —— 每次 push 都跑等于
# 把最贵的一档检查花在最不需要它新鲜的场景上。发现项走 Security 页签，triage 进
# Issues 任务池（P11；发现即登记，同一条规则管 nightly 的死信告警）。
#
# 路径豁免：frontend/dist（入库的**构建产物**，minified 代码只会产噪音）与
# schema.gen.ts / openapi.json（**生成物**，人工修不了它们——要修去修生成器的输入）。
# 手动 dispatch 随时可跑：给"刚改完一段敏感代码想立刻扫"的场景留的门。

on:
  schedule:
    - cron: "0 1 * * 1" # 每周一 UTC 01:00（北京 09:00）
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL 分析（python + javascript-typescript）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript-typescript
          queries: security-extended
          paths-ignore: |
            frontend/dist
            frontend/src/api/schema.gen.ts
            frontend/openapi.json
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python,javascript-typescript"
