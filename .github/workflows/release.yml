name: Release

# 发布链（审查快照 P1-14）：tag（v*）→ 安装包进 Release + 镜像 push ghcr。
# 前置「锁文件」已由 `4826f98` 落地（2026-10-07），发布的镜像从此逐次构建可复现。
#
# 为什么单独一条 workflow 而不是塞进 ci.yml：发布是「按 tag 触发、产物进 Release 与
# 镜像仓库」的独立关注点，和「每次 push/PR 跑门禁」的节奏不同；两者混在一起只会让
# ci.yml 的 `concurrency` 与触发条件更难读。这条只在有人**显式打 tag** 或手动
# `workflow_dispatch` 时跑，不会污染日常 CI 绿。
#
# 与 ci.yml 的分工：ci.yml 负责「门禁绿不绿」；这条负责「绿了之后把可出货的产物
# 钉成一份」。它本身**不重跑门禁**（信任 main 上已绿的 CI），但 `needs` 不存在这里——
# 因为 tag 可能从任意 commit 打；所以发布job 自己先把门禁里的「离线快档」跑一遍当
# 最后一道闸（见下方 `python scripts/gate.py --fast`），再打包。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "一并打出的 tag（如 0.4.0，留空则不自动建 tag）"
        type: string
        default: ""

permissions:
  contents: write      # 建 Release、推 tag
  packages: write      # push ghcr.io 镜像

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # 第一道闸：离线快档门禁（不依赖 node/浏览器/真机，2 分钟左右）。tag 往往从
  # 历史 commit 打，不能假设那条 commit 的 CI 还绿，所以发布前自己先跑一遍。
  gate:
    name: 发布前快档门禁
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      # Node + npm ci：`gate.py --fast` 的「前端 vitest」步骤要它。2026-10-09 v0.3.0 首次
      # 打 tag 时这条链第一次真跑，当场红在 `vitest: not found` —— 这条 workflow 从前只在
      # 文档里活着（与 ENGI-23 那族"从未跑过的尾巴"同形状：没有读数的步骤是猜的）。
      # 装 Node 的形状与 ci.yml frontend job 一致（22 + npm 缓存 + 双 package-lock）。
      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            shell/package-lock.json
      - name: 装前端依赖
        run: npm ci --prefix frontend
      - name: gate.py --fast
        env:
          GATE_READINGS_SCRATCH: "1"
        run: python scripts/gate.py --fast

  # 镜像：push 到 ghcr.io，按 tag 与 latest 双重标。复用 Dockerfile（已锁安装、
  # 非 root、HEALTHCHECK 齐备），与 ci.yml 的 docker job 同一份源。
  image:
    name: 镜像 push ghcr
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 计算 tag
        id: meta
        shell: bash
        run: |
          # refs/tags/v0.3.0 -> 0.3.0；手动触发时用输入版本
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "发布版本：$VER"
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          # 把版本写进 OCI 标签，方便 traceability
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # Windows 安装包：复用 ci.yml 那套「跑用例→build 侧车→打 NSIS」顺序，产物进 Release。
  # 注意它在 windows-latest 上、按 2× 计费，但发布本来就是低频动作，且这是「出货那一份」。
  installer:
    name: Windows 安装包
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: 装打包机依赖（锁）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Windows 臂跑一遍用例
        run: python scripts/pytest_with_evidence.py --lane fast
      - name: 装 Node（只壳）
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shell/package-lock.json
      - name: 界面产物用入库那份 dist
        shell: pwsh
        run: |
          if (-not (Test-Path frontend/dist/index.html)) {
            throw "入库的 frontend/dist 不见了"
          }
      - name: 打随包后端（②）
        run: python scripts/build_sidecar.py
      - name: 事后尺子：src import 的每一族都在包里
        run: python scripts/check_bundle_parity.py
      - name: 随包后端起一次并答 /api/health
        shell: pwsh
        env:
          DATA_ROOT: ${{ runner.temp }}/rc-sidecar-data
          MODEL_PIN_ON_STARTUP: "0"
        run: |
          $exe = "build/sidecar/rolecard-backend/rolecard-backend.exe"
          if (-not (Test-Path $exe)) { throw "没有 $exe —— ② 没产出可执行后端" }
          $p = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            for ($i = 1; $i -le 45; $i++) {
              Start-Sleep -Seconds 2
              if ($p.HasExited) { throw "随包后端起了又退（exit=$($p.ExitCode)）" }
              try {
                $h = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -TimeoutSec 5
                if ($h.StatusCode -eq 200) { break }
              } catch { }
            }
            if ($p.HasExited -or $i -ge 45) { throw "90 秒内 /api/health 没答 200" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: 打 NSIS 安装包（④）
        working-directory: shell
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci 失败（exit=$LASTEXITCODE）" }
          npm run package
          if ($LASTEXITCODE -ne 0) { throw "electron-builder 失败（exit=$LASTEXITCODE）" }
      - name: 产物核对
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "shell/release/rolecard-agent-*-x64.exe" -ErrorAction SilentlyContinue)
          if ($files.Count -ne 1) {
            $seen = @(Get-ChildItem shell/release -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ", "
            throw "期望正好 1 个安装包，实际 $($files.Count)。shell/release 里是：$seen"
          }
          if ($files[0].Length -lt 60MB) { throw "安装包只有 $([math]::Round($files[0].Length/1MB,2)) MB：随包后端多半没进 extraResources" }
          Write-Host "安装包 $($files[0].Name) = $([math]::Round($files[0].Length/1MB,2)) MB"
      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: rolecard-agent-installer
          path: shell/release/rolecard-agent-*-x64.exe
          retention-days: 14

  # 把镜像与安装包钉成一份 Release。tag 推送时自动建 Release；手动触发且填了版本
  # 时，先建 tag 再建 Release（让下载页有对应版本号）。
  publish:
    name: 建 Release
    needs: [gate, image, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 计算版本
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "version_nov=$VER" >> "$GITHUB_OUTPUT"
      - name: 手动触发时建 tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        shell: bash
        run: |
          git config user.name "rolecard-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.meta.outputs.version }}" -m "Release v${{ steps.meta.outputs.version }}"
          git push origin "v${{ steps.meta.outputs.version }}"
      - name: 取安装包产物
        uses: actions/download-artifact@v4
        with:
          name: rolecard-agent-installer
          path: artifact
      - name: 建 Release 并附安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          EXE=$(ls artifact/*.exe | head -n1)
          gh release create "v${{ steps.meta.outputs.version }}" \
            --title "v${{ steps.meta.outputs.version }}" \
            --generate-notes \
            --repo "${{ github.repository }}" \
            "$EXE"
          echo "Release v${{ steps.meta.outputs.version }} 已建，镜像已 push 至 ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
