name: Release

# 发布链（审查快照 P1-14）：tag（v*）→ 安装包进 Release + 镜像 push ghcr。
# 前置「锁文件」已由 `4826f98` 落地（2026-10-07），发布的镜像从此逐次构建可复现。
#
# 为什么单独一条 workflow 而不是塞进 ci.yml：发布是「按 tag 触发、产物进 Release 与
# 镜像仓库」的独立关注点，和「每次 push/PR 跑门禁」的节奏不同；两者混在一起只会让
# ci.yml 的 `concurrency` 与触发条件更难读。这条只在有人**显式打 tag** 或手动
# `workflow_dispatch` 时跑，不会污染日常 CI 绿。
#
# 与 ci.yml 的分工：ci.yml 负责「门禁绿不绿」；这条负责「绿了之后把可出货的产物
# 钉成一份」。它本身**不重跑门禁**（信任 main 上已绿的 CI），但 `needs` 不存在这里——
# 因为 tag 可能从任意 commit 打；所以发布job 自己先把门禁里的「离线快档」跑一遍当
# 最后一道闸（见下方 `python scripts/gate.py --fast`），再打包。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "一并打出的 tag（如 0.4.0，留空则不自动建 tag）"
        type: string
        default: ""

permissions:
  contents: write      # 建 Release、推 tag
  packages: write      # push ghcr.io 镜像

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # 第一道闸：**全量门禁**（P 收尾·分层决定，2026-10-26：全量档归位到"发版时"——
  # 日常 push 的 CI 本来就是 --ci 单趟不全量，真正的缺口是发版这道闸从前只跑快档，
  # 覆盖率地板 / dist 同步 / 随包 parity / shell 判据 / 两只文档探针在发布物上都没看过。
  # tag 往往从历史 commit 打，不能假设那条 commit 的 CI 还绿，所以发布前自己先跑一遍。
  # 冒烟的浏览器段走 SMOKE_SKIP_UI=1（hosted runner 无显示器；UI 段是 nightly 臂
  # 自托管真机的职责，这条注释与 gate.py 的真机冒烟步骤互为分工说明）。
  gate:
    name: 发布前全量门禁
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量档含「改动行覆盖率」（基线 origin/main）：浅拷贝没有历史，diff 直接没得分。
          fetch-depth: 0
      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements/requirements.lock
            requirements/requirements-dev.txt
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.lock
      # Node + npm ci：全量档的「前端 vitest / tsc+build」与「shell typecheck / updater
      # 清理判据」都要它。2026-10-09 v0.3.0 首次打 tag 时这条链第一次真跑，当场红在
      # `vitest: not found` —— 这条 workflow 从前只在文档里活着（与 ENGI-23 那族
      # "从未跑过的尾巴"同形状：没有读数的步骤是猜的）。装 Node 的形状与 ci.yml
      # frontend job 一致（22 + npm 缓存 + 双 package-lock）。
      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            shell/package-lock.json
      - name: 装前端与壳依赖
        run: |
          npm ci --prefix frontend
          npm ci --prefix shell
      - name: gate.py 全量（浏览器段交给 nightly 真机）
        env:
          GATE_READINGS_SCRATCH: "1"
          SMOKE_SKIP_UI: "1"
        # 外部墙钟兜一层：进程内看门狗（每步 STEP_TIMEOUTS）+ 外部 timeout 双保险，
        # 与 ci.yml 全量臂同一形状。job 预算 25 分钟、内部 deadline 22 分钟。
        run: |
          command -v timeout >/dev/null || {
            echo '❌ runner 上没有 GNU timeout：外部墙钟这一层根本没建立'
            exit 3
          }
          code=0
          timeout --kill-after=30s 1320s python scripts/gate.py --deadline-minutes 22 || code=$?
          if [ "$code" = 124 ] || [ "$code" = 137 ]; then
            echo '❌ 外部墙钟（timeout 22m）把这趟杀了：进程内的看门狗没做到'
          fi
          exit "$code"

  # 镜像：push 到 ghcr.io，按 tag 与 latest 双重标。复用 Dockerfile（已锁安装、
  # 非 root、HEALTHCHECK 齐备），与 ci.yml 的 docker job 同一份源。
  image:
    name: 镜像 push ghcr
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 计算 tag
        id: meta
        shell: bash
        run: |
          # refs/tags/v0.3.0 -> 0.3.0；手动触发时用输入版本。
          # 镜像名**整体小写**：ghcr 仓库名不许大写（`ghcr.io/HCX0426/...` 会报
          # "repository name must be lowercase"，2026-10-09 v0.3.0 首次实跑红在这里 ——
          # `${{ github.repository }}` 原样带出 owner 的大写，echo 里手工转一次）。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          IMAGE="$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "发布版本：$VER / 镜像：$IMAGE"
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          # 把版本写进 OCI 标签，方便 traceability
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # Windows 安装包：复用 ci.yml 那套「跑用例→build 侧车→打 NSIS」顺序，产物进 Release。
  # 注意它在 windows-latest 上、按 2× 计费，但发布本来就是低频动作，且这是「出货那一份」。
  installer:
    name: Windows 安装包
    needs: gate
    runs-on: windows-latest
    # 30 → 55 分钟：OCR worker 那一族（独立 venv 装 rapidocr/onnxruntime/cv2 + PyInstaller
    # 打 258 MB 的树 + 冒烟推理）实测本机就要十几分钟（2026-10-13 P0 修复接入）。
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/requirements.lock
      - name: 装打包机依赖（锁）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.lock
      - name: Windows 臂跑一遍用例
        run: python scripts/pytest_with_evidence.py --lane fast
      - name: 装 Node（只壳）
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shell/package-lock.json
      - name: 界面产物用入库那份 dist
        shell: pwsh
        run: |
          if (-not (Test-Path frontend/dist/index.html)) {
            throw "入库的 frontend/dist 不见了"
          }
      - name: 打随包后端（②）
        run: python scripts/build_sidecar.py
      - name: 事后尺子：src import 的每一族都在包里
        run: python scripts/check_bundle_parity.py
      # ---------------- 随包 OCR worker（P0 修复，2026-10-13） ----------------
      # 为什么单列一步组：`electron-builder.yml` 的 extraResources 从 b87e36c（10-03）起就
      # 指着 build/ocrworker/ocr-worker，但两条打包臂从没跑过 build_ocr_worker.py ——
      # 于是 v0.3.0 起每个"成功"的装机包都没带本地 OCR（缺失源被 electron-builder 静默
      # 跳过，注释里"当场报找不到源"的假设是错的；60MB 弱判据轻松放行 198MB 的无 OCR 包）。
      # 判据链：① 这里构建失败 = 红；② 打包前断言源目录在场；③ 打包后断言 win-unpacked
      # 里有 ocr-worker.exe —— 三道闸，任何一道失守都当场红，不再靠体积猜。
      - name: 建独立 OCR venv 并打随包 worker（②b）
        shell: pwsh
        run: |
          python -m venv .venv-ocr
          .venv-ocr\Scripts\python.exe -m pip install --upgrade pip
          .venv-ocr\Scripts\python.exe -m pip install -r requirements/requirements-ocr.txt -r requirements/requirements-package-ocr.txt
          if ($LASTEXITCODE -ne 0) { throw "OCR venv 装依赖失败" }
          .venv-ocr\Scripts\python.exe scripts\tools\build_ocr_worker.py
          if ($LASTEXITCODE -ne 0) { throw "build_ocr_worker 失败（exit=$LASTEXITCODE）—— 冒烟没过或 PyInstaller 崩了" }
      - name: 前置闸：OCR worker 源目录在场
        shell: pwsh
        run: |
          if (-not (Test-Path "build/ocrworker/ocr-worker/ocr-worker.exe")) {
            throw "build/ocrworker/ocr-worker 不在 —— ②b 没产出，electron-builder 会把这条 extraResources 静默跳过（就是 v0.3.0~v0.4.1 每个包没有 OCR 的死法）"
          }
      - name: 随包后端起一次并答 /api/health
        shell: pwsh
        env:
          DATA_ROOT: ${{ runner.temp }}/rc-sidecar-data
          MODEL_PIN_ON_STARTUP: "0"
        run: |
          $exe = "build/sidecar/rolecard-backend/rolecard-backend.exe"
          if (-not (Test-Path $exe)) { throw "没有 $exe —— ② 没产出可执行后端" }
          $p = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            for ($i = 1; $i -le 45; $i++) {
              Start-Sleep -Seconds 2
              if ($p.HasExited) { throw "随包后端起了又退（exit=$($p.ExitCode)）" }
              try {
                $h = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -TimeoutSec 5
                if ($h.StatusCode -eq 200) { break }
              } catch { }
            }
            if ($p.HasExited -or $i -ge 45) { throw "90 秒内 /api/health 没答 200" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: 打 NSIS 安装包（④）
        working-directory: shell
        # `--publish never`（2026-10-13 dispatch 实测逼出来的）：加了 publish 段之后，
        # electron-builder 在 CI 上会**当场尝试上传 Release**，而这条 job 没有 GH_TOKEN
        # —— 死法：`GitHubPublisher: token is not set`。发布仍归 publish job 的
        # `gh release create`（build 与 publish 分离是 electron-updater 的标准姿势）。
        # 读 PublishManager.js 核实过 never 不砍清单：latest.yml（158 行）与包内
        # app-update.yml（87 行）的产出都不看 isPublish，只看 publish 配置在不在。
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci 失败（exit=$LASTEXITCODE）" }
          npm run package -- --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder 失败（exit=$LASTEXITCODE）" }
      - name: 产物核对
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "shell/release/rolecard-agent-*-x64.exe" -ErrorAction SilentlyContinue)
          if ($files.Count -ne 1) {
            $seen = @(Get-ChildItem shell/release -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ", "
            throw "期望正好 1 个安装包，实际 $($files.Count)。shell/release 里是：$seen"
          }
          # 强判据（P0 修复的第三道闸）：dir target 与 nsis 同场产出，win-unpacked 就是
          # 安装包的解包等价物 —— 直接点名两份随包资源在不在，不再靠体积猜。
          $ocr = "shell/release/win-unpacked/resources/ocr-worker/ocr-worker.exe"
          if (-not (Test-Path $ocr)) {
            throw "安装包里没有 $ocr：extraResources 那条又静默失效了（v0.3.0~v0.4.1 每个包没 OCR 的 P0 死法，不许重演）"
          }
          $be = "shell/release/win-unpacked/resources/rolecard-backend/rolecard-backend.exe"
          if (-not (Test-Path $be)) { throw "安装包里没有 $be：随包后端没进 extraResources" }
          $mb = [math]::Round($files[0].Length / 1MB, 2)
          # 体积下界 60MB → 250MB：OCR worker（258 MB 未压缩）进包后不存在 250 以下的可能。
          # 主判据是上面两条点名；这条只是第二哨兵（读数，随依赖漂，但漂不破 250 的下界）。
          if ($mb -lt 250) { throw "安装包只有 $mb MB：OCR worker 多半没进包（点名判据却过了？查 win-unpacked 与 nsis 是否同源）" }
          # 自动更新的 feed 清单（设计稿 §3.3）：electron-updater 找的就是这份 latest.yml。
          # 缺它 = "检查更新"永远报找不到更新而**不报错** —— 静默失效的防线，当场点名。
          if (-not (Test-Path "shell/release/latest.yml")) {
            throw "shell/release/latest.yml 不在：nsis 没产 feed 清单，自动更新会静默失灵"
          }
          Write-Host "安装包 $($files[0].Name) = $mb MB（ocr-worker 与 backend 点名在场，latest.yml 在场）"
      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: rolecard-agent-installer
          path: |
            shell/release/rolecard-agent-*-x64.exe
            shell/release/*.yml
          retention-days: 14

  # 把镜像与安装包钉成一份 Release。tag 推送时自动建 Release；手动触发且填了版本
  # 时，先建 tag 再建 Release（让下载页有对应版本号）。
  publish:
    name: 建 Release
    needs: [gate, image, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 计算版本
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "version_nov=$VER" >> "$GITHUB_OUTPUT"
          # 预发布判定（P10 beta 通道，2026-10-26）：semver 带连字符 = 有 prerelease 段
          # （0.5.0-beta.1）。预发布走独立 channel feed（electron-builder 出 beta.yml、
          # electron-updater allowPrerelease 才读得到），Release 打 prerelease 标志 ——
          # 稳定通道用户绝不该被推到 beta，灰度的收口就靠这个形状。
          if [[ "$VER" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 手动触发时建 tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        shell: bash
        run: |
          git config user.name "HCX0426"
          git config user.email "chongxuan-huang@outlook.com"
          git tag -a "v${{ steps.meta.outputs.version }}" -m "Release v${{ steps.meta.outputs.version }}"
          git push origin "v${{ steps.meta.outputs.version }}"
      - name: 取安装包产物
        uses: actions/download-artifact@v4
        with:
          name: rolecard-agent-installer
          path: artifact
      - name: 建 Release 并附安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          EXE=$(ls artifact/*.exe | head -n1)
          PRERELEASE="${{ steps.meta.outputs.prerelease }}"
          # feed 清单必须跟 exe 同场：electron-updater 找的就是这份 yml，
          # 只传 exe 的 Release 会让装机用户的"检查更新"静默失灵（不报错，永远"无更新"）。
          # 两个路径都要求 latest.yml（v0.5.1-beta.1 发布闸实测修正）：electron-builder 对
          # GitHub provider **只出当前通道一个 yml**（源码原话 "for GitHub should be
          # pre-release way be used" —— GitHub 的通道隔离就是 prerelease 标志本身，
          # generateUpdatesFilesForAllChannels 对 github 是 no-op）；而 electron-updater 的
          # GitHubProvider 在 allowPrerelease 下先试 beta.yml、404 时**显式回退 latest.yml**
          # （源码注释 "Allow fallback to latest.yml"）。所以预发布 Release 带 latest.yml
          # 就是 beta 用户的合法 feed；稳定通道客户端只读非预发布 Release，红线不破。
          # 最初那版要求 beta.yml，建立在"electron-builder 会按版本段出 beta.yml"的
          # 错误假设上 —— 守卫尽职地红了，红得对。
          ls artifact/latest.yml >/dev/null 2>&1 || {
            echo "❌ 没有 latest.yml：nsis 没产 feed 清单，自动更新会静默失灵（稳定与预发布两个路径都靠它）"
            exit 1
          }
          if [ "$PRERELEASE" = "true" ]; then
            FLAG="--prerelease"
          else
            FLAG=""
          fi
          # shellcheck disable=SC2086
          gh release create "v${{ steps.meta.outputs.version }}" \
            --title "v${{ steps.meta.outputs.version }}" \
            --generate-notes $FLAG \
            --repo "${{ github.repository }}" \
            "$EXE" artifact/*.yml
          echo "Release v${{ steps.meta.outputs.version }} 已建（exe + feed yml，prerelease=$PRERELEASE），镜像已 push 至 ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
