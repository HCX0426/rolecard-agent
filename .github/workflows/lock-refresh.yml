name: Lock refresh

# 每周重新解析两把锁，有真变化就开一张 PR（快照 P1-12 ④ / ENGI-15 ② 的最后一格）。
#
# 为什么判"变没变"不能按字节比（2026-10-08 实测，不是推测）：
#   在这台机上屏蔽本地 pip 配置后重新 compile，174/136 条 pin **一条没动**，字节比仍差
#   一行 —— 人工流程按 CONTRIBUTING 8.2 删掉 `--index-url/--trusted-host` 那两行时，
#   顺带走了横幅后的空行。按字节比 = **每周开一张内容为空的 PR**，第三周没人再看，
#   这件事就从"有人管"退化成"有个自动化在制造噪音"。比较口径住在
#   `scripts/tools/recompile_locks.py`（去横幅与空行的结构行），判据只这一处。
#
# 为什么 `windows-latest`（而这条仓库其余的调度 job 是 ubuntu-24.04）：
#   锁里有 `pywin32` / `pefile` 这类只在 `sys_platform=='win32'` 下才出现的解析产物
#   （实查 mcp 与 pyinstaller 的 wheel 元数据），本产品 Windows-first、出货的那份环境
#   就是 Windows。Linux runner 上重新解析会得到一份**结构不同**的锁 —— 那叫换平台，
#   不叫依赖更新。`windows-latest` 不钉具体版本与 ci.yml 的 `windows-release` 同一口径：
#   它的产物不参与"CI 绿不绿"，钉版只给"会漂的量"用（覆盖率读数那一类）。
#
# 为什么 PR 之前先自己验一遍：GitHub 的既定行为是 **`GITHUB_TOKEN` 开的 PR 不会触发
#   checks** —— 那张 PR 送来时是"没被机器看过"的状态，而锁改动的失败形状恰恰是"装不上 /
#   装上后测试红"。把没验过的版本变更推给人评审，等于把风险从"漂"换成"炸"。所以这一条
#   job 在新锁上先跑一遍快档用例（与 P1-13 的 Windows 测试臂同一个入口、同一份判据），
#   绿了才开 PR，并把"已验证"写进正文；**红了就不开 PR、让这一趟红着**。
#
# 退出码的形状（这一步最容易写错的地方）：`recompile_locks.py` 用 0=没变 / 1=变了 / 2=跑不动。
#   若直接把 1 交给 runner，它会当成"步骤失败"——于是**每个正常的变化周都会红**，
#   而红过一次之后人就学会忽略这条 workflow 了。所以这里显式把 0/1 翻成 output、
#   **只有 2 才让作业红**："刷不动"报成"本周无事"才是真正不能接受的失效形状
#   （与 audit_deps 的"扫不成 ≠ 干净"同一条判据）。

on:
  schedule:
    # 每周一 UTC 03:00（北京 11:00，开发时段内 —— 红了当天就能看见，不是躺在夜里）。
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write # 推刷新分支
  pull-requests: write # 开那张差异 PR

concurrency:
  group: lock-refresh
  cancel-in-progress: false # 正在跑的这一周别被后来的排期掐掉：它要么给 PR，要么给一次红

jobs:
  refresh-constraints:
    # ENGI-18 第三路（2026-10-09 拍板）：约束行必须在 **Linux** 上实测 resolve —— 与上面那把
    # Windows 锁**刻意分开两条 job**：uvloop 的声明带 sys_platform 门，win32 永远解析不出它，
    # 放进 windows job 会把「没有」写成「上游改了」并静默删掉约束（脚本自己也退 2 挡这一步）。
    # 两个 PR 各答各的问题（锁更新 / Linux 约束更新），罕见同周都变时开两张，不互相绑。
    name: 刷新 Linux 约束行（Linux 实测 resolve）
    runs-on: ubuntu-24.04
    # 估的，与上面那把同一句话：只保证卡死不躺到 GitHub 默认 360 分钟；真跑过再按实测收回。
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 解析约束行（0=没变 / 1=变了 / 2=跑不动）
        id: resolve
        shell: bash
        run: |
          python -m pip install --upgrade pip
          rc=0
          python scripts/tools/refresh_constraints.py || rc=$?
          if [ "$rc" -eq 0 ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" -eq 1 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::error::刷不动约束行（exit=$rc）：这一趟必须红，不许当成‘本周无事’"
          exit "$rc"

      - name: 变了 → 在新约束上装锁 + 快档用例
        if: steps.resolve.outputs.changed == 'true'
        id: validate
        shell: bash
        run: |
          pip install -r requirements.lock -c constraints-linux.txt
          python scripts/pytest_with_evidence.py --lane fast

      - name: 验绿才开 PR
        # validate 红 ⇒ 这一步不跑，作业红：与上面那把锁同一个纪律 ——
        # 宁可见红，不见"没被机器看过的版本变更 PR"。
        if: steps.resolve.outputs.changed == 'true' && steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DIFF="$(git diff -- constraints-linux.txt | grep -E '^[+-]uvloop==' || true)"
          if [ -z "$DIFF" ]; then
            echo "::error::工具说有变化，diff 却挑不出 uvloop 行 —— 不开 PR，红在这里"
            exit 1
          fi
          SHA="$(git rev-parse --short HEAD)"
          BRANCH="bot/lock-refresh/constraints-${SHA}"
          git config user.name "rolecard-lock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add constraints-linux.txt
          git commit -m "chore(deps): 刷新 Linux 约束行 uvloop（run_id=${{ github.run_id }}）"
          git push -u origin "$BRANCH"
          {
            echo "## Linux 约束行刷新（uvloop）"
            echo
            echo "由 \`scripts/tools/refresh_constraints.py\` 在 **Ubuntu runner** 上按锁里的"
            echo "uvicorn pin 实测 \`pip --dry-run --report\` 产出（Windows 侧解析不出这条，"
            echo "这正是 ENGI-18 单立一条 Linux job 的原因）。"
            echo
            echo "### 版本变化"
            echo '```'
            echo "${DIFF}"
            echo '```'
            echo
            echo "### 已验证"
            echo "- \`pip install -r requirements.lock -c constraints-linux.txt\` 装得上；"
            echo "- \`scripts/pytest_with_evidence.py --lane fast\` 绿。"
            echo "- 本 PR 由 \`GITHUB_TOKEN\` 开出，**不会自动触发 checks**（GitHub 既定行为），"
            echo "  所以证据是上面这一条 job 里跑的；需要远端门禁请手动 dispatch 一次 CI。"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(deps): 刷新 Linux 约束行（uvloop）" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --repo "${{ github.repository }}"

  refresh:
    name: 重解析锁 + 验一遍 + 开 PR
    runs-on: windows-latest
    # 45 分钟是**估的，没有实测支撑**（这条 workflow 还没跑过，也没有 run log 可引；
    # 本机那几次重新解析我只记了"变没变"，没记墙钟）。等第一次真跑完按实测收回 ——
    # 别把这条注释当读数用。它现在只保证一件事：卡死不会一路躺到 GitHub 的默认 360
    # 分钟（`R28-25` 那条"每条 job 都要有 timeout"的判据）。
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8 # 中文与「▶」在管道输出上会撞 GBK，见 gate.py 那段编码注释
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13" # 与 Dockerfile 基座、ci.yml 同一条版本线
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 装当前锁
        # 装锁而不是 requirements-dev.txt：pip-tools 的版本要和锁里记的那份一致
        # （`pip-tools==7.6.2`）—— 解析器换版本可能整把锁重排，那就不是"依赖更新"了。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: 重新解析两把锁（0=没变 / 1=变了 / 2=跑不动）
        id: recompile
        shell: bash
        run: |
          # runner 的 bash 带 `-e`：裸写 `python ...; rc=$?` 会在退 1 时**当场把步骤弄红**，
          # 于是每个正常的变化周都红一次 —— 而红过一周之后人就学会忽略这条 workflow 了。
          # `|| rc=$?` 是这里唯一的写法：把退出码收进变量，交给下面显式分流。
          rc=0
          python scripts/tools/recompile_locks.py || rc=$?
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]; then
            if [ "$rc" -eq 1 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          echo "::error::刷不动锁（exit=$rc）：这一趟必须红，不许当成‘本周无事’"
          exit "$rc"

      - name: 有新解析 → 先在新锁上跑一遍快档用例
        if: steps.recompile.outputs.changed == 'true'
        id: validate
        shell: bash
        run: |
          pip install -r requirements.lock
          python scripts/pytest_with_evidence.py --lane fast

      - name: 用例绿了才开 PR
        # validate 红 ⇒ 这一步不跑，作业红：宁可见红，不见"没人看的空 PR"。
        if: steps.recompile.outputs.changed == 'true' && steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # 差异清单**在提交之前**取（工作树 vs HEAD）：checkout 默认是浅克隆，
          # `git diff HEAD~1` 在这里会 "bad revision" 失败，而 `|| true` 把它吞成一份
          # **空白的版本变化**——那张 PR 的正文就会写着"没变化"，正是本条 workflow
          # 从头防的那个失效形状，换了个入口再来一次。
          DIFF="$(git diff -- requirements.lock requirements-runtime.lock \
                  | grep -E '^[+-][A-Za-z0-9._-]+==' | sort || true)"
          if [ -z "$DIFF" ]; then
            echo "::error::工具说有变化，diff 却挑不出任何 pin 行 —— 不开 PR，红在这里"
            exit 1
          fi
          SHA="$(git rev-parse --short HEAD)"
          BRANCH="bot/lock-refresh/${SHA}"
          git config user.name "rolecard-lock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add requirements.lock requirements-runtime.lock
          git commit -m "chore(deps): 每周重解析两把锁（run_id=${{ github.run_id }}）"
          git push -u origin "$BRANCH"
          # 正文两样东西：变了哪些 pin（上面那份差异清单），以及"本条 job 已在新锁上
          # 跑绿快档用例"的证据 —— 因为这张 PR 不会自带 checks。
          {
            echo "## 每周锁刷新"
            echo
            echo "由 \`scripts/tools/recompile_locks.py\` 在 Windows runner 上重新解析产出"
            echo "（本地 pip 配置已屏蔽 —— 锁不钉镜像源，CONTRIBUTING 8.2）。"
            echo
            echo "### 版本变化"
            echo '```'
            echo "${DIFF}"
            echo '```'
            echo
            echo "### 已验证"
            echo "- 新锁 \`pip install -r requirements.lock\` 装得上；"
            echo "- \`scripts/pytest_with_evidence.py --lane fast\` 绿"
            echo "  （与 Windows 测试臂同一入口、同一份判据）。"
            echo "- 本 PR 由 \`GITHUB_TOKEN\` 开出，**不会自动触发 checks**（GitHub 既定行为），"
            echo "  所以证据是上面这一条 job 里跑的；需要远端门禁请手动 dispatch 一次 CI。"
          } > "$RUNNER_TEMP/pr-body.md" # 写进 runner 临时目录：工作树里不留一份能被下次 add 捡走的正文
          gh pr create --base main --head "$BRANCH" \
            --title "chore(deps): 每周重解析两把锁" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --repo "${{ github.repository }}"
