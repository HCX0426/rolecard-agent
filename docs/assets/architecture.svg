<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 648" width="960" height="648"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#94a3b8"/>
    </marker>
    <marker id="arw2" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect width="960" height="648" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">rolecard-agent · 架构总览</text>
  <text x="480" y="57" text-anchor="middle" font-size="13" fill="#64748b">角色卡驱动的对话 Agent 内核 + 可插拔领域插件（本地优先 / 可公网部署）</text>

  <!-- 1 客户端 -->
  <rect x="24" y="78" width="912" height="54" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="40" y="110" font-size="12" font-weight="700" fill="#1d4ed8">客户端</text>
  <rect x="150" y="88" width="770" height="34" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="535" y="109" text-anchor="middle" font-size="13" fill="#0f172a">浏览器 · 控制台 SPA（Vite + React）　对话 / 角色卡 / 插件 / 设置　四页签</text>

  <line x1="480" y1="133" x2="480" y2="148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 2 接入层 -->
  <rect x="24" y="150" width="912" height="70" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="40" y="190" font-size="12" font-weight="700" fill="#0369a1">接入层</text>
  <rect x="150" y="160" width="370" height="50" rx="8" fill="#ffffff" stroke="#bae6fd"/>
  <text x="335" y="181" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">FastAPI 管理面 API</text>
  <text x="335" y="199" text-anchor="middle" font-size="12" fill="#475569">角色卡 CRUD · 插件启停 · 设置 · 知识库</text>
  <rect x="550" y="160" width="370" height="50" rx="8" fill="#ffffff" stroke="#bae6fd"/>
  <text x="735" y="181" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">对话面 /api/chat（SSE 流式）</text>
  <text x="735" y="199" text-anchor="middle" font-size="12" fill="#475569">会话 / 历史回放 / 文件上传</text>

  <line x1="480" y1="221" x2="480" y2="236" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 3 内核 harness -->
  <rect x="24" y="238" width="912" height="118" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="40" y="300" font-size="12" font-weight="700" fill="#4338ca">内核</text>
  <text x="40" y="318" font-size="11" fill="#6366f1">harness</text>

  <rect x="150" y="248" width="245" height="48" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="272" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">LangGraph 状态图</text>
  <text x="272" y="285" text-anchor="middle" font-size="11.5" fill="#475569">call_model · execute_tools</text>

  <rect x="405" y="248" width="245" height="48" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="527" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">角色卡与权限</text>
  <text x="527" y="285" text-anchor="middle" font-size="11.5" fill="#475569">bind_tools 两阶段过滤</text>

  <rect x="660" y="248" width="260" height="48" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="790" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">工具注册表</text>
  <text x="790" y="285" text-anchor="middle" font-size="11.5" fill="#475569">内核工具 + 领域工具</text>

  <rect x="150" y="304" width="245" height="44" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="272" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">SQLite Checkpoint</text>
  <text x="272" y="339" text-anchor="middle" font-size="11.5" fill="#475569">重启进程历史仍在</text>

  <rect x="405" y="304" width="245" height="44" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="527" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">可观测门面</text>
  <text x="527" y="339" text-anchor="middle" font-size="11.5" fill="#475569">local JSON / 云端可选 · 默认脱敏</text>

  <rect x="660" y="304" width="260" height="44" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="790" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">输出审核（安全红线）</text>
  <text x="790" y="339" text-anchor="middle" font-size="11.5" fill="#475569">提示词代码固化 · 最后拼</text>

  <line x1="480" y1="357" x2="480" y2="372" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 4 能力层 -->
  <rect x="24" y="374" width="912" height="96" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="40" y="427" font-size="12" font-weight="700" fill="#047857">能力</text>

  <rect x="150" y="384" width="370" height="76" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="335" y="405" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">RAG 检索（内核能力）</text>
  <text x="335" y="423" text-anchor="middle" font-size="11.5" fill="#475569">chroma 分作用域 · 可插拔嵌入 bge-m3 / hash</text>
  <text x="335" y="440" text-anchor="middle" font-size="11.5" fill="#475569">rerank 精排（默认开）· 延迟 P50/P95/P99</text>

  <rect x="550" y="384" width="370" height="76" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="735" y="405" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">文档摄取 parser</text>
  <text x="735" y="423" text-anchor="middle" font-size="11.5" fill="#475569">.txt / .md / .pdf 文本抽取</text>
  <text x="735" y="440" text-anchor="middle" font-size="11.5" fill="#475569">可插拔 OCR：本地 RapidOCR 优先 / 云端 key 兜底</text>

  <line x1="480" y1="471" x2="480" y2="486" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 5 领域插件 -->
  <rect x="24" y="488" width="912" height="64" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="40" y="526" font-size="12" font-weight="700" fill="#b45309">领域插件</text>
  <rect x="150" y="498" width="770" height="44" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="535" y="517" text-anchor="middle" font-size="12" fill="#0f172a">domains/health —— 档案查询 · 跨年指标对比 · 列表（示例领域）</text>
  <text x="535" y="534" text-anchor="middle" font-size="11.5" fill="#475569">插件启停：停用即从可见工具集消失（tool_epoch 实时生效，无需重启）</text>

  <line x1="480" y1="553" x2="480" y2="568" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 6 外部依赖 -->
  <rect x="24" y="570" width="912" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="604" font-size="12" font-weight="700" fill="#475569">外部</text>
  <rect x="150" y="579" width="770" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="535" y="604" text-anchor="middle" font-size="12" fill="#334155">Ollama / OpenAI 兼容端点　·　SiliconFlow（bge-m3 嵌入 / bge-reranker 精排）　·　本地 PaddleOCR / 云端 OCR API</text>
</svg>
